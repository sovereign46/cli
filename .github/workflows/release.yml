name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  actions: read
  contents: read

concurrency:
  group: release-homebrew-writer
  cancel-in-progress: false

jobs:
  validate:
    name: validate exact sequence-3 candidate and annotated tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.publication.outputs.artifact-id }}
      artifact_digest: ${{ steps.publication.outputs.artifact-digest }}
      artifact_name: ${{ steps.handoff.outputs.name }}
      producer_attempt: ${{ steps.handoff.outputs.attempt }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - name: Validate and render immutable authority successors
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = sovereign46/cli
          test "$GITHUB_WORKFLOW_REF" = "sovereign46/cli/.github/workflows/release.yml@refs/tags/$GITHUB_REF_NAME"
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git fetch --quiet --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$GITHUB_SHA"
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          commit=$(git rev-parse HEAD)
          test "$commit" = "$GITHUB_SHA"
          tag_object=$(git rev-parse "refs/tags/$GITHUB_REF_NAME")
          test "$(git ls-remote origin "refs/tags/$GITHUB_REF_NAME" | awk '{print $1}')" = "$tag_object"
          source_tree=$(git rev-parse HEAD^{tree})
          release_id=$(PYTHONPATH=scripts python3 -c 'import sys; from release_authority import release_id; print(release_id("sovereign46/cli", sys.argv[1]))' "$GITHUB_REF_NAME")
          publication="$RUNNER_TEMP/publication"
          bundle="$publication/qualified-release"
          mkdir -m 0700 -p "$bundle"
          authority_kind=candidate
          authority_record="$RUNNER_TEMP/current-candidate.json"
          authority_etag="$RUNNER_TEMP/current-candidate.etag"
          if scripts/release_authority.py capture --kind candidate --id "$release_id" \
              --record-output "$authority_record" --etag-output "$authority_etag"; then
            jq -e --arg id "$release_id" --arg tag "$GITHUB_REF_NAME" --arg commit "$commit" --arg tree "$source_tree" --arg tagObject "$tag_object" '
              .schema == "s46.release-authority.record.v1" and .id == $id and .state == "candidate" and
              (.sequence == 3 or .sequence == 4) and .source.repository == "sovereign46/cli" and .source.tag == $tag and
              .source.commit == $commit and
              ((.sequence == 3 and .source.tagObject == "") or (.sequence == 4 and .source.tagObject == $tagObject)) and
              (.source.bundleSha256 | test("^[0-9a-f]{64}$")) and
              ([.assets[] | select(.name == "release-build.json")][0].sha256 == .source.bundleSha256) and (.assets | length) == 15 and
              ([.annotations[] | select(.name == "source-tree")][0].value == $tree)
            ' "$authority_record" >/dev/null
          else
            authority_kind=release
            authority_record="$RUNNER_TEMP/current-release.json"
            authority_etag="$RUNNER_TEMP/current-release.etag"
            scripts/release_authority.py capture --kind release --id "$release_id" \
              --record-output "$authority_record" --etag-output "$authority_etag"
            jq -e --arg id "$release_id" --arg tag "$GITHUB_REF_NAME" --arg commit "$commit" --arg tree "$source_tree" --arg tagObject "$tag_object" '
              .schema == "s46.release-authority.record.v1" and .id == $id and .state == "published" and
              .sequence == 5 and .source.repository == "sovereign46/cli" and .source.tag == $tag and
              .source.commit == $commit and .source.tagObject == $tagObject and (.source.bundleSha256 | test("^[0-9a-f]{64}$")) and
              ([.assets[] | select(.name == "release-build.json")][0].sha256 == .source.bundleSha256) and (.assets | length) == 15 and
              ([.annotations[] | select(.name == "source-tree")][0].value == $tree)
            ' "$authority_record" >/dev/null
          fi
          jq -er '.assets[].name' "$authority_record" | while IFS= read -r asset; do
            scripts/release_authority.py download --kind "$authority_kind" --id "$release_id" --asset "$asset" --output "$bundle/$asset"
          done
          go run ./scripts check-tag "$GITHUB_REF_NAME" "$commit" "$bundle"
          scripts/cli_release_authority.py qualified-recovery-records \
            --tag "$GITHUB_REF_NAME" --commit "$commit" --source-tree "$source_tree" --bundle "$bundle" \
            --sequence-one-output "$publication/candidate-sequence-1.json" \
            --sequence-two-output "$publication/candidate-sequence-2.json" \
            --sequence-three-output "$publication/candidate-sequence-3.json"
          scripts/cli_release_authority.py tagged-record \
            --sequence-three "$publication/candidate-sequence-3.json" --tag-object "$tag_object" \
            --output "$publication/candidate-sequence-4.json"
          scripts/cli_release_authority.py expected-release \
            --sequence-four "$publication/candidate-sequence-4.json" --output "$publication/release-sequence-5.json"
          if test "$authority_kind" = candidate; then
            sequence=$(jq -er .sequence "$authority_record")
            if test "$sequence" = 3; then
              cmp -s "$authority_record" "$publication/candidate-sequence-3.json"
              cmp -s "$authority_etag" "$publication/candidate-sequence-3.json.etag"
            else
              test "$sequence" = 4
              cmp -s "$authority_record" "$publication/candidate-sequence-4.json"
              cmp -s "$authority_etag" "$publication/candidate-sequence-4.json.etag"
            fi
          else
            cmp -s "$authority_record" "$publication/release-sequence-5.json"
            cmp -s "$authority_etag" "$publication/release-sequence-5.json.etag"
          fi
          go run ./scripts homebrew-formula "$GITHUB_REF_NAME" "$bundle" > "$publication/s46.rb"
          jq -n --arg schema s46.validated-release-publication.v2 --arg tag "$GITHUB_REF_NAME" \
            --arg commit "$commit" --arg tagObject "$tag_object" --arg releaseId "$release_id" \
            --arg runId "$GITHUB_RUN_ID" --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            '{schema:$schema,tag:$tag,commit:$commit,tagObject:$tagObject,releaseAuthorityId:$releaseId,runId:$runId,runAttempt:$runAttempt}' \
            > "$publication/publication.json"
      - name: Bind the producer-qualified publication artifact name
        id: handoff
        shell: bash
        run: |
          set -euo pipefail
          printf 'name=validated-release-publication-%s\nattempt=%s\n' \
            "$GITHUB_RUN_ATTEMPT" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Upload immutable publication artifact
        id: publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.handoff.outputs.name }}
          path: ${{ runner.temp }}/publication
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false

  bind-tag:
    name: bind the annotated tag exactly once as sequence 4
    needs: validate
    runs-on: ubuntu-24.04
    environment: cli-release-authority-stage
    permissions:
      actions: read
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact_id }}
          path: ${{ runner.temp }}/publication
          merge-multiple: true
      - name: Verify exact publication handoff and protected stage policy
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AUTHORITY_POLICY_TOKEN }}
          ARTIFACT_ID: ${{ needs.validate.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.validate.outputs.artifact_digest }}
          ARTIFACT_NAME: ${{ needs.validate.outputs.artifact_name }}
          PRODUCER_ATTEMPT: ${{ needs.validate.outputs.producer_attempt }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PRODUCER_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          test "$ARTIFACT_NAME" = "validated-release-publication-$PRODUCER_ATTEMPT"
          artifacts="$RUNNER_TEMP/release-artifacts.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > "$artifacts"
          jq -e --argjson id "$ARTIFACT_ID" --arg digest "sha256:$ARTIFACT_DIGEST" --arg name "$ARTIFACT_NAME" \
            --argjson run "$GITHUB_RUN_ID" --arg commit "$GITHUB_SHA" '
            [.artifacts[] | select(.id == $id)] as $selected |
            .total_count == (.artifacts | length) and .total_count <= 100 and ($selected | length) == 1 and
            ($selected[0].expired | not) and $selected[0].name == $name and $selected[0].digest == $digest and
            $selected[0].workflow_run.id == $run and $selected[0].workflow_run.head_sha == $commit
          ' "$artifacts" >/dev/null
          zip="$RUNNER_TEMP/publication-handoff.zip"
          curl --fail --location --silent --show-error \
            --header "Accept: application/vnd.github+json" --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" --output "$zip" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"
          test "$(sha256sum "$zip" | cut -d' ' -f1)" = "$ARTIFACT_DIGEST"
          python3 - "$zip" "$RUNNER_TEMP/publication" <<'PY'
          import pathlib, stat, sys, zipfile
          archive, extracted = sys.argv[1], pathlib.Path(sys.argv[2])
          actual = {path.relative_to(extracted).as_posix() for path in extracted.rglob("*") if path.is_file() and not path.is_symlink()}
          with zipfile.ZipFile(archive) as source:
              members = [member for member in source.infolist() if not member.is_dir()]
              names = {member.filename for member in members}
              if len(names) != len(members) or names != actual:
                  raise SystemExit("publication handoff extraction does not match its checksummed artifact")
              for member in members:
                  mode = member.external_attr >> 16
                  if pathlib.PurePosixPath(member.filename).is_absolute() or ".." in pathlib.PurePosixPath(member.filename).parts or stat.S_ISLNK(mode) or member.file_size <= 0 or member.file_size > 268435456 or member.flag_bits & 1:
                      raise SystemExit("publication handoff has unsafe metadata")
                  if source.read(member) != (extracted / member.filename).read_bytes():
                      raise SystemExit("publication handoff bytes differ from its checksummed artifact")
          PY
          jq -e --arg run "$GITHUB_RUN_ID" --arg attempt "$PRODUCER_ATTEMPT" \
            '.schema == "s46.validated-release-publication.v2" and .runId == $run and .runAttempt == $attempt' \
            "$RUNNER_TEMP/publication/publication.json" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/environments/cli-release-authority-stage" > "$RUNNER_TEMP/stage-environment.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" > "$RUNNER_TEMP/stage-approvals.json"
          jq -e '.can_admins_bypass == false and (.protection_rules | length) == 1 and .protection_rules[0].type == "required_reviewers" and .protection_rules[0].prevent_self_review == true and ([.protection_rules[0].reviewers[] | select(.type == "User") | .reviewer.login] | sort) == ["fredoliveira", "goncalossilva"]' "$RUNNER_TEMP/stage-environment.json" >/dev/null
          jq -e 'any(.[]; (.state | ascii_downcase) == "approved" and (.user.login == "fredoliveira" or .user.login == "goncalossilva") and any(.environments[]?; .name == "cli-release-authority-stage"))' "$RUNNER_TEMP/stage-approvals.json" >/dev/null
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .protected)" = true
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main/protection" --jq '.enforce_admins.enabled and .required_linear_history.enabled and (.allow_force_pushes.enabled | not) and (.allow_deletions.enabled | not) and .required_status_checks.strict and any(.required_status_checks.checks[]?; .context == "test" and .app_id == 15368) and .required_pull_request_reviews.dismiss_stale_reviews and (.required_pull_request_reviews.required_approving_review_count >= 1) and .required_pull_request_reviews.require_last_push_approval and .required_conversation_resolution.enabled')" = true
          test "$(gh api "repos/$GITHUB_REPOSITORY/immutable-releases" --jq .enabled)" = true
          gh api "repos/$GITHUB_REPOSITORY/rulesets?per_page=100" > "$RUNNER_TEMP/tag-rulesets.json"
          ruleset_id=$(jq -er --arg repository "$GITHUB_REPOSITORY" '[.[] | select(.name == "Immutable semantic release tags" and .target == "tag" and .source_type == "Repository" and .source == $repository and .enforcement == "active")] | if length == 1 then .[0].id else error("missing or ambiguous immutable tag ruleset") end' "$RUNNER_TEMP/tag-rulesets.json")
          gh api "repos/$GITHUB_REPOSITORY/rulesets/$ruleset_id" > "$RUNNER_TEMP/tag-ruleset.json"
          jq -e --argjson id "$ruleset_id" --arg repository "$GITHUB_REPOSITORY" '
            .id == $id and .name == "Immutable semantic release tags" and .target == "tag" and
            .source_type == "Repository" and .source == $repository and .enforcement == "active" and
            .bypass_actors == [] and .current_user_can_bypass == "never" and
            .conditions.ref_name == {exclude:[],include:["refs/tags/v*.*.*"]} and
            ([.rules[].type] | sort) == ["deletion","update"]
          ' "$RUNNER_TEMP/tag-ruleset.json" >/dev/null
          tag=$(jq -er .tag "$RUNNER_TEMP/publication/publication.json")
          tag_object=$(jq -er .tagObject "$RUNNER_TEMP/publication/publication.json")
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" \
            | jq -e --arg object "$tag_object" '.object.type == "tag" and .object.sha == $object' >/dev/null
      - name: Replace only the exact sequence-3 candidate
        shell: bash
        env:
          AUTHORITY_SSH_TARGET: ${{ vars.AUTHORITY_STAGE_SSH_TARGET }}
          AUTHORITY_STAGE_SSH_KEY: ${{ secrets.AUTHORITY_STAGE_SSH_KEY }}
          AUTHORITY_STAGE_KNOWN_HOSTS: ${{ secrets.AUTHORITY_STAGE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          cleanup_authority_credentials() {
            cleanup_status=0
            rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts" || cleanup_status=$?
            unset AUTHORITY_SSH_TARGET AUTHORITY_STAGE_SSH_KEY AUTHORITY_STAGE_KNOWN_HOSTS
            return "$cleanup_status"
          }
          trap cleanup_authority_credentials EXIT
          test "$GITHUB_WORKFLOW_REF" = "sovereign46/cli/.github/workflows/release.yml@refs/tags/$GITHUB_REF_NAME"
          test -n "$AUTHORITY_SSH_TARGET"
          test -n "$AUTHORITY_STAGE_SSH_KEY"
          test -n "$AUTHORITY_STAGE_KNOWN_HOSTS"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$AUTHORITY_STAGE_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$AUTHORITY_STAGE_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          publication="$RUNNER_TEMP/publication"
          release_id=$(jq -er .releaseAuthorityId "$publication/publication.json")
          if scripts/release_authority.py capture --kind release --id "$release_id" \
              --record-output "$RUNNER_TEMP/current-release.json" --etag-output "$RUNNER_TEMP/current-release.etag"; then
            cmp -s "$RUNNER_TEMP/current-release.json" "$publication/release-sequence-5.json"
            cmp -s "$RUNNER_TEMP/current-release.etag" "$publication/release-sequence-5.json.etag"
            cleanup_authority_credentials
            trap - EXIT
            if scripts/release_authority.py capture --kind candidate --id "$release_id" \
                --record-output "$RUNNER_TEMP/unexpected-candidate.json" --etag-output "$RUNNER_TEMP/unexpected-candidate.etag"; then
              echo "candidate remained beside the exact immutable release" >&2
              exit 1
            fi
            exit 0
          fi
          scripts/release_authority.py capture --kind candidate --id "$release_id" \
            --record-output "$RUNNER_TEMP/current.json" --etag-output "$RUNNER_TEMP/current.etag"
          sequence=$(jq -er .sequence "$RUNNER_TEMP/current.json")
          if test "$sequence" = 3; then
            cmp -s "$RUNNER_TEMP/current.json" "$publication/candidate-sequence-3.json"
            cmp -s "$RUNNER_TEMP/current.etag" "$publication/candidate-sequence-3.etag"
            scripts/release_authority.py append \
              --ssh-host "$AUTHORITY_SSH_TARGET" --ssh-key "$HOME/.ssh/id_ed25519" --known-hosts "$HOME/.ssh/known_hosts" \
              --record "$publication/candidate-sequence-4.json" --if-match "$(<"$RUNNER_TEMP/current.etag")" \
              --response-output "$RUNNER_TEMP/replaced.json"
          elif test "$sequence" = 4; then
            cmp -s "$RUNNER_TEMP/current.json" "$publication/candidate-sequence-4.json"
            cmp -s "$RUNNER_TEMP/current.etag" "$publication/candidate-sequence-4.json.etag"
          else
            echo "authority candidate is outside the exact tag-binding recovery profile" >&2
            exit 1
          fi
          cleanup_authority_credentials
          trap - EXIT
          scripts/release_authority.py capture --kind candidate --id "$release_id" \
            --record-output "$RUNNER_TEMP/final.json" --etag-output "$RUNNER_TEMP/final.etag"
          cmp -s "$RUNNER_TEMP/final.json" "$publication/candidate-sequence-4.json"
          cmp -s "$RUNNER_TEMP/final.etag" "$publication/candidate-sequence-4.json.etag"

  finalize-authority:
    name: publish-only immutable sequence 5
    needs: [validate, bind-tag]
    runs-on: ubuntu-24.04
    environment: cli-release-authority-publish
    permissions:
      actions: read
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact_id }}
          path: ${{ runner.temp }}/publication
          merge-multiple: true
      - name: Verify exact publication handoff and protected publish policy
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AUTHORITY_POLICY_TOKEN }}
          ARTIFACT_ID: ${{ needs.validate.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.validate.outputs.artifact_digest }}
          ARTIFACT_NAME: ${{ needs.validate.outputs.artifact_name }}
          PRODUCER_ATTEMPT: ${{ needs.validate.outputs.producer_attempt }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PRODUCER_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          test "$ARTIFACT_NAME" = "validated-release-publication-$PRODUCER_ATTEMPT"
          artifacts="$RUNNER_TEMP/release-artifacts.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > "$artifacts"
          jq -e --argjson id "$ARTIFACT_ID" --arg digest "sha256:$ARTIFACT_DIGEST" --arg name "$ARTIFACT_NAME" \
            --argjson run "$GITHUB_RUN_ID" --arg commit "$GITHUB_SHA" '
            [.artifacts[] | select(.id == $id)] as $selected |
            .total_count == (.artifacts | length) and .total_count <= 100 and ($selected | length) == 1 and
            ($selected[0].expired | not) and $selected[0].name == $name and $selected[0].digest == $digest and
            $selected[0].workflow_run.id == $run and $selected[0].workflow_run.head_sha == $commit
          ' "$artifacts" >/dev/null
          zip="$RUNNER_TEMP/publication-handoff.zip"
          curl --fail --location --silent --show-error \
            --header "Accept: application/vnd.github+json" --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" --output "$zip" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"
          test "$(sha256sum "$zip" | cut -d' ' -f1)" = "$ARTIFACT_DIGEST"
          python3 - "$zip" "$RUNNER_TEMP/publication" <<'PY'
          import pathlib, stat, sys, zipfile
          archive, extracted = sys.argv[1], pathlib.Path(sys.argv[2])
          actual = {path.relative_to(extracted).as_posix() for path in extracted.rglob("*") if path.is_file() and not path.is_symlink()}
          with zipfile.ZipFile(archive) as source:
              members = [member for member in source.infolist() if not member.is_dir()]
              names = {member.filename for member in members}
              if len(names) != len(members) or names != actual:
                  raise SystemExit("publication handoff extraction does not match its checksummed artifact")
              for member in members:
                  mode = member.external_attr >> 16
                  if pathlib.PurePosixPath(member.filename).is_absolute() or ".." in pathlib.PurePosixPath(member.filename).parts or stat.S_ISLNK(mode) or member.file_size <= 0 or member.file_size > 268435456 or member.flag_bits & 1:
                      raise SystemExit("publication handoff has unsafe metadata")
                  if source.read(member) != (extracted / member.filename).read_bytes():
                      raise SystemExit("publication handoff bytes differ from its checksummed artifact")
          PY
          jq -e --arg run "$GITHUB_RUN_ID" --arg attempt "$PRODUCER_ATTEMPT" \
            '.schema == "s46.validated-release-publication.v2" and .runId == $run and .runAttempt == $attempt' \
            "$RUNNER_TEMP/publication/publication.json" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/environments/cli-release-authority-publish" > "$RUNNER_TEMP/publish-environment.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" > "$RUNNER_TEMP/publish-approvals.json"
          jq -e '.can_admins_bypass == false and (.protection_rules | length) == 1 and .protection_rules[0].type == "required_reviewers" and .protection_rules[0].prevent_self_review == true and ([.protection_rules[0].reviewers[] | select(.type == "User") | .reviewer.login] | sort) == ["fredoliveira", "goncalossilva"]' "$RUNNER_TEMP/publish-environment.json" >/dev/null
          jq -e 'any(.[]; (.state | ascii_downcase) == "approved" and (.user.login == "fredoliveira" or .user.login == "goncalossilva") and any(.environments[]?; .name == "cli-release-authority-publish"))' "$RUNNER_TEMP/publish-approvals.json" >/dev/null
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .protected)" = true
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main/protection" --jq '.enforce_admins.enabled and .required_linear_history.enabled and (.allow_force_pushes.enabled | not) and (.allow_deletions.enabled | not) and .required_status_checks.strict and any(.required_status_checks.checks[]?; .context == "test" and .app_id == 15368) and .required_pull_request_reviews.dismiss_stale_reviews and (.required_pull_request_reviews.required_approving_review_count >= 1) and .required_pull_request_reviews.require_last_push_approval and .required_conversation_resolution.enabled')" = true
          test "$(gh api "repos/$GITHUB_REPOSITORY/immutable-releases" --jq .enabled)" = true
          gh api "repos/$GITHUB_REPOSITORY/rulesets?per_page=100" > "$RUNNER_TEMP/tag-rulesets.json"
          ruleset_id=$(jq -er --arg repository "$GITHUB_REPOSITORY" '[.[] | select(.name == "Immutable semantic release tags" and .target == "tag" and .source_type == "Repository" and .source == $repository and .enforcement == "active")] | if length == 1 then .[0].id else error("missing or ambiguous immutable tag ruleset") end' "$RUNNER_TEMP/tag-rulesets.json")
          gh api "repos/$GITHUB_REPOSITORY/rulesets/$ruleset_id" > "$RUNNER_TEMP/tag-ruleset.json"
          jq -e --argjson id "$ruleset_id" --arg repository "$GITHUB_REPOSITORY" '
            .id == $id and .name == "Immutable semantic release tags" and .target == "tag" and
            .source_type == "Repository" and .source == $repository and .enforcement == "active" and
            .bypass_actors == [] and .current_user_can_bypass == "never" and
            .conditions.ref_name == {exclude:[],include:["refs/tags/v*.*.*"]} and
            ([.rules[].type] | sort) == ["deletion","update"]
          ' "$RUNNER_TEMP/tag-ruleset.json" >/dev/null
          tag=$(jq -er .tag "$RUNNER_TEMP/publication/publication.json")
          tag_object=$(jq -er .tagObject "$RUNNER_TEMP/publication/publication.json")
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" \
            | jq -e --arg object "$tag_object" '.object.type == "tag" and .object.sha == $object' >/dev/null
      - name: Finalize the exact sequence-4 candidate
        shell: bash
        env:
          AUTHORITY_SSH_TARGET: ${{ vars.AUTHORITY_PUBLISH_SSH_TARGET }}
          AUTHORITY_PUBLISH_SSH_KEY: ${{ secrets.AUTHORITY_PUBLISH_SSH_KEY }}
          AUTHORITY_PUBLISH_KNOWN_HOSTS: ${{ secrets.AUTHORITY_PUBLISH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          cleanup_authority_credentials() {
            cleanup_status=0
            rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts" || cleanup_status=$?
            unset AUTHORITY_SSH_TARGET AUTHORITY_PUBLISH_SSH_KEY AUTHORITY_PUBLISH_KNOWN_HOSTS
            return "$cleanup_status"
          }
          trap cleanup_authority_credentials EXIT
          test -n "$AUTHORITY_SSH_TARGET"
          test -n "$AUTHORITY_PUBLISH_SSH_KEY"
          test -n "$AUTHORITY_PUBLISH_KNOWN_HOSTS"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$AUTHORITY_PUBLISH_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$AUTHORITY_PUBLISH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          publication="$RUNNER_TEMP/publication"
          release_id=$(jq -er .releaseAuthorityId "$publication/publication.json")
          if scripts/release_authority.py capture --kind release --id "$release_id" \
              --record-output "$RUNNER_TEMP/current-release.json" --etag-output "$RUNNER_TEMP/current-release.etag"; then
            cmp -s "$RUNNER_TEMP/current-release.json" "$publication/release-sequence-5.json"
            cmp -s "$RUNNER_TEMP/current-release.etag" "$publication/release-sequence-5.json.etag"
          else
            scripts/release_authority.py capture --kind candidate --id "$release_id" \
              --record-output "$RUNNER_TEMP/current-candidate.json" --etag-output "$RUNNER_TEMP/current-candidate.etag"
            cmp -s "$RUNNER_TEMP/current-candidate.json" "$publication/candidate-sequence-4.json"
            cmp -s "$RUNNER_TEMP/current-candidate.etag" "$publication/candidate-sequence-4.json.etag"
            scripts/release_authority.py finalize \
              --ssh-host "$AUTHORITY_SSH_TARGET" --ssh-key "$HOME/.ssh/id_ed25519" --known-hosts "$HOME/.ssh/known_hosts" \
              --id "$release_id" \
              --if-match "$(<"$RUNNER_TEMP/current-candidate.etag")" --response-output "$RUNNER_TEMP/finalized.json"
          fi
          cleanup_authority_credentials
          trap - EXIT
          scripts/release_authority.py capture --kind release --id "$release_id" \
            --record-output "$RUNNER_TEMP/final.json" --etag-output "$RUNNER_TEMP/final.etag"
          cmp -s "$RUNNER_TEMP/final.json" "$publication/release-sequence-5.json"
          cmp -s "$RUNNER_TEMP/final.etag" "$publication/release-sequence-5.json.etag"
          if scripts/release_authority.py capture --kind candidate --id "$release_id" \
              --record-output "$RUNNER_TEMP/unexpected-candidate.json" --etag-output "$RUNNER_TEMP/unexpected-candidate.etag"; then
            echo "candidate remained after immutable finalization" >&2
            exit 1
          fi

  github-mirror:
    name: mirror immutable authority bytes to GitHub
    needs: [validate, finalize-authority]
    runs-on: ubuntu-24.04
    environment: release-publication
    permissions:
      actions: read
      contents: write
      deployments: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact_id }}
          path: ${{ runner.temp }}/publication
          merge-multiple: true
      - name: Verify immutable authority and mirror exact bytes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_POLICY_TOKEN: ${{ secrets.AUTHORITY_POLICY_TOKEN }}
          ARTIFACT_ID: ${{ needs.validate.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.validate.outputs.artifact_digest }}
          ARTIFACT_NAME: ${{ needs.validate.outputs.artifact_name }}
          PRODUCER_ATTEMPT: ${{ needs.validate.outputs.producer_attempt }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_POLICY_TOKEN"
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PRODUCER_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          test "$ARTIFACT_NAME" = "validated-release-publication-$PRODUCER_ATTEMPT"
          artifacts="$RUNNER_TEMP/release-artifacts.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > "$artifacts"
          jq -e --argjson id "$ARTIFACT_ID" --arg digest "sha256:$ARTIFACT_DIGEST" --arg name "$ARTIFACT_NAME" \
            --argjson run "$GITHUB_RUN_ID" --arg commit "$GITHUB_SHA" '
            [.artifacts[] | select(.id == $id)] as $selected |
            .total_count == (.artifacts | length) and .total_count <= 100 and ($selected | length) == 1 and
            ($selected[0].expired | not) and $selected[0].name == $name and $selected[0].digest == $digest and
            $selected[0].workflow_run.id == $run and $selected[0].workflow_run.head_sha == $commit
          ' "$artifacts" >/dev/null
          zip="$RUNNER_TEMP/publication-handoff.zip"
          curl --fail --location --silent --show-error \
            --header "Accept: application/vnd.github+json" --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" --output "$zip" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"
          test "$(sha256sum "$zip" | cut -d' ' -f1)" = "$ARTIFACT_DIGEST"
          python3 - "$zip" "$RUNNER_TEMP/publication" <<'PY'
          import pathlib, stat, sys, zipfile
          archive, extracted = sys.argv[1], pathlib.Path(sys.argv[2])
          actual = {path.relative_to(extracted).as_posix() for path in extracted.rglob("*") if path.is_file() and not path.is_symlink()}
          with zipfile.ZipFile(archive) as source:
              members = [member for member in source.infolist() if not member.is_dir()]
              names = {member.filename for member in members}
              if len(names) != len(members) or names != actual:
                  raise SystemExit("publication handoff extraction does not match its checksummed artifact")
              for member in members:
                  mode = member.external_attr >> 16
                  if pathlib.PurePosixPath(member.filename).is_absolute() or ".." in pathlib.PurePosixPath(member.filename).parts or stat.S_ISLNK(mode) or member.file_size <= 0 or member.file_size > 268435456 or member.flag_bits & 1:
                      raise SystemExit("publication handoff has unsafe metadata")
                  if source.read(member) != (extracted / member.filename).read_bytes():
                      raise SystemExit("publication handoff bytes differ from its checksummed artifact")
          PY
          jq -e --arg run "$GITHUB_RUN_ID" --arg attempt "$PRODUCER_ATTEMPT" \
            '.schema == "s46.validated-release-publication.v2" and .runId == $run and .runAttempt == $attempt' \
            "$RUNNER_TEMP/publication/publication.json" >/dev/null
          policy_api() { GH_TOKEN="$RELEASE_POLICY_TOKEN" gh api --method GET "$@"; }
          policy_api "repos/$GITHUB_REPOSITORY/environments/release-publication" > "$RUNNER_TEMP/release-environment.json"
          policy_api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" > "$RUNNER_TEMP/release-approvals.json"
          jq -e '
            .can_admins_bypass == false and
            (.protection_rules | length) == 1 and
            .protection_rules[0].type == "required_reviewers" and
            .protection_rules[0].prevent_self_review == true and
            ([.protection_rules[0].reviewers[] | select(.type == "User") | .reviewer.login] | sort) == ["fredoliveira", "goncalossilva"]
          ' "$RUNNER_TEMP/release-environment.json" >/dev/null
          jq -e '
            any(.[];
              (.state | ascii_downcase) == "approved" and
              (.user.login == "fredoliveira" or .user.login == "goncalossilva") and
              any(.environments[]?; .name == "release-publication")
            )
          ' "$RUNNER_TEMP/release-approvals.json" >/dev/null
          test "$(policy_api "repos/$GITHUB_REPOSITORY/branches/main" --jq .protected)" = true
          test "$(policy_api "repos/$GITHUB_REPOSITORY/branches/main/protection" --jq '.enforce_admins.enabled and .required_linear_history.enabled and (.allow_force_pushes.enabled | not) and (.allow_deletions.enabled | not) and .required_status_checks.strict and any(.required_status_checks.checks[]?; .context == "test" and .app_id == 15368) and .required_pull_request_reviews.dismiss_stale_reviews and (.required_pull_request_reviews.required_approving_review_count >= 1) and .required_pull_request_reviews.require_last_push_approval and .required_conversation_resolution.enabled')" = true
          test "$(policy_api "repos/$GITHUB_REPOSITORY/immutable-releases" --jq .enabled)" = true
          policy_api "repos/$GITHUB_REPOSITORY/rulesets?per_page=100" > "$RUNNER_TEMP/tag-rulesets.json"
          ruleset_id=$(jq -er --arg repository "$GITHUB_REPOSITORY" '[.[] | select(.name == "Immutable semantic release tags" and .target == "tag" and .source_type == "Repository" and .source == $repository and .enforcement == "active")] | if length == 1 then .[0].id else error("missing or ambiguous immutable tag ruleset") end' "$RUNNER_TEMP/tag-rulesets.json")
          policy_api "repos/$GITHUB_REPOSITORY/rulesets/$ruleset_id" > "$RUNNER_TEMP/tag-ruleset.json"
          jq -e --argjson id "$ruleset_id" --arg repository "$GITHUB_REPOSITORY" '
            .id == $id and .name == "Immutable semantic release tags" and .target == "tag" and
            .source_type == "Repository" and .source == $repository and .enforcement == "active" and
            .bypass_actors == [] and .current_user_can_bypass == "never" and
            .conditions.ref_name == {exclude:[],include:["refs/tags/v*.*.*"]} and
            ([.rules[].type] | sort) == ["deletion","update"]
          ' "$RUNNER_TEMP/tag-ruleset.json" >/dev/null
          publication="$RUNNER_TEMP/publication"
          bundle="$publication/qualified-release"
          metadata="$publication/publication.json"
          release_id=$(jq -er .releaseAuthorityId "$metadata")
          tag=$(jq -er .tag "$metadata")
          commit=$(jq -er .commit "$metadata")
          tag_object=$(jq -er .tagObject "$metadata")
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" \
            | jq -e --arg object "$tag_object" '.object.type == "tag" and .object.sha == $object' >/dev/null
          curl --fail --silent --show-error --output "$RUNNER_TEMP/authority-release.json" \
            "https://models.s46.dev/release-authority/v1/releases/$release_id"
          cmp -s "$RUNNER_TEMP/authority-release.json" "$publication/release-sequence-5.json"
          python3 - "$publication/release-sequence-5.json" "$bundle" <<'PY'
          import hashlib, json, os, pathlib, sys, urllib.parse, urllib.request
          record_path, destination = sys.argv[1:]
          record = json.loads(pathlib.Path(record_path).read_bytes())
          destination = pathlib.Path(destination)
          for asset in record["assets"]:
              path = destination / asset["name"]
              url = "https://models.s46.dev/release-authority/v1/releases/{}/assets/{}".format(record["id"], urllib.parse.quote(asset["name"], safe=""))
              with urllib.request.urlopen(url, timeout=60) as response:
                  raw = response.read(asset["size"] + 1)
              if len(raw) != asset["size"] or hashlib.sha256(raw).hexdigest() != asset["sha256"] or path.read_bytes() != raw:
                  raise SystemExit(f"authority asset mismatch: {asset['name']}")
          PY
          if ! gh release view "$tag" --json isDraft >/dev/null 2>&1; then
            gh release create "$tag" --draft --verify-tag --target "$commit" --title "$tag" --generate-notes
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > "$RUNNER_TEMP/mirror.json"
          test "$(jq -r .target_commitish "$RUNNER_TEMP/mirror.json")" = "$commit"
          published=$(jq -r '.draft | not' "$RUNNER_TEMP/mirror.json")
          python3 - "$RUNNER_TEMP/mirror.json" "$bundle" "$RUNNER_TEMP/missing" "$RUNNER_TEMP/starters" <<'PY'
          import hashlib, json, pathlib, re, sys
          release_path, bundle_path, missing_path, starters_path = sys.argv[1:]
          release = json.loads(pathlib.Path(release_path).read_bytes())
          if release.get("prerelease") is not False:
              raise SystemExit("GitHub mirror must not be a prerelease")
          bundle = pathlib.Path(bundle_path)
          expected = {path.name: path for path in bundle.iterdir() if path.is_file() and not path.is_symlink()}
          assets = release.get("assets", [])
          names = [item.get("name") for item in assets if isinstance(item, dict)]
          identifiers = [item.get("id") for item in assets if isinstance(item, dict)]
          if (len(names) != len(assets) or len(names) != len(set(names)) or not set(names).issubset(expected) or
                  len(identifiers) != len(assets) or len(identifiers) != len(set(identifiers))):
              raise SystemExit("GitHub mirror is outside the exact deterministic recovery profile")
          uploaded, starters = set(), []
          digest = re.compile(r"sha256:[0-9a-f]{64}")
          for item in assets:
              name, identifier, state = item.get("name"), item.get("id"), item.get("state")
              if not isinstance(identifier, int) or isinstance(identifier, bool) or identifier <= 0:
                  raise SystemExit(f"GitHub mirror asset identity is invalid: {name!r}")
              if state == "starter":
                  if release.get("draft") is not True or item.get("size") != 0 or item.get("digest") is not None:
                      raise SystemExit(f"GitHub mirror has an unrecoverable incomplete asset: {name!r}")
                  starters.append((identifier, name))
              elif state == "uploaded":
                  raw = expected[name].read_bytes()
                  if item.get("size") != len(raw) or item.get("digest") != "sha256:" + hashlib.sha256(raw).hexdigest() or not digest.fullmatch(item.get("digest", "")):
                      raise SystemExit(f"GitHub mirror has mismatched existing metadata: {name!r}")
                  uploaded.add(name)
              else:
                  raise SystemExit(f"GitHub mirror asset has an invalid state: {name!r}")
          pathlib.Path(missing_path).write_text("".join(name + "\n" for name in sorted(set(expected) - uploaded)))
          pathlib.Path(starters_path).write_text("".join(f"{identifier}\t{name}\n" for identifier, name in sorted(starters)))
          PY
          while IFS=$'\t' read -r starter_id starter_name; do
            test -z "$starter_id" || gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$starter_id"
          done < "$RUNNER_TEMP/starters"
          if test "$published" = true && test -s "$RUNNER_TEMP/missing"; then
            echo "immutable GitHub mirror is incomplete" >&2
            exit 1
          fi
          while IFS= read -r name; do
            test -z "$name" || gh release upload "$tag" "$bundle/$name"
          done < "$RUNNER_TEMP/missing"
          remote="$RUNNER_TEMP/github-mirror"
          mkdir -m 0700 "$remote"
          gh release download "$tag" --dir "$remote"
          test "$(find "$remote" -maxdepth 1 -type f | wc -l | tr -d '[:space:]')" = 15
          for asset in "$bundle"/*; do
            cmp -s "$asset" "$remote/$(basename "$asset")"
          done
          mirror_id=$(jq -er '.id | select(type == "number" and . > 0)' "$RUNNER_TEMP/mirror.json")
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" \
            | jq -e --arg object "$tag_object" '.object.type == "tag" and .object.sha == $object' >/dev/null
          if test "$published" = false; then
            gh release edit "$tag" --draft=false --prerelease=false
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > "$RUNNER_TEMP/final-mirror.json"
          python3 - "$RUNNER_TEMP/final-mirror.json" "$publication/release-sequence-5.json" "$mirror_id" "$tag" "$commit" <<'PY'
          import json, pathlib, re, sys
          release_path, authority_path, release_id, tag, commit = sys.argv[1:]
          release = json.loads(pathlib.Path(release_path).read_bytes())
          authority = json.loads(pathlib.Path(authority_path).read_bytes())
          expected = {asset["name"]: asset for asset in authority["assets"]}
          assets = release.get("assets", [])
          names = [asset.get("name") for asset in assets if isinstance(asset, dict)]
          identifiers = [asset.get("id") for asset in assets if isinstance(asset, dict)]
          if (release.get("id") != int(release_id) or release.get("tag_name") != tag or
                  release.get("target_commitish") != commit or release.get("draft") is not False or
                  release.get("immutable") is not True or release.get("prerelease") is not False or
                  len(assets) != len(expected) or len(names) != len(set(names)) or set(names) != set(expected) or
                  len(identifiers) != len(set(identifiers))):
              raise SystemExit("published GitHub mirror identity or exact asset cohort is wrong")
          digest = re.compile(r"sha256:[0-9a-f]{64}")
          for asset in assets:
              wanted = expected[asset["name"]]
              if (not isinstance(asset.get("id"), int) or isinstance(asset.get("id"), bool) or asset["id"] <= 0 or
                      asset.get("state") != "uploaded" or asset.get("size") != wanted["size"] or
                      asset.get("digest") != "sha256:" + wanted["sha256"] or
                      not digest.fullmatch(asset.get("digest", ""))):
                  raise SystemExit(f"published GitHub mirror metadata mismatch: {asset.get('name')!r}")
          PY
          final_remote="$RUNNER_TEMP/github-mirror-final"
          mkdir -m 0700 "$final_remote"
          gh release download "$tag" --dir "$final_remote"
          test "$(find "$final_remote" -maxdepth 1 -type f | wc -l | tr -d '[:space:]')" = 15
          for asset in "$bundle"/*; do
            cmp -s "$asset" "$final_remote/$(basename "$asset")"
          done
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
            | jq -S '{id,tag_name,target_commitish,draft,immutable,prerelease,assets:[.assets[]|{id,name,size,digest,state}]|sort_by(.name)}' \
            > "$RUNNER_TEMP/final-mirror-recheck.json"
          jq -S '{id,tag_name,target_commitish,draft,immutable,prerelease,assets:[.assets[]|{id,name,size,digest,state}]|sort_by(.name)}' \
            "$RUNNER_TEMP/final-mirror.json" > "$RUNNER_TEMP/final-mirror-first.json"
          cmp -s "$RUNNER_TEMP/final-mirror-first.json" "$RUNNER_TEMP/final-mirror-recheck.json"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" \
            | jq -e --arg object "$tag_object" '.object.type == "tag" and .object.sha == $object' >/dev/null

