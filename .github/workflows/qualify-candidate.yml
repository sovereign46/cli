            esac
          done
          if find "$pending_signatures" -maxdepth 1 -type f -print -quit | grep -q .; then
            while IFS= read -r pending; do
              gh release upload "$candidate_tag" "$pending"
            done < <(find "$pending_signatures" -maxdepth 1 -type f -print | sort)
          fi
          verified="$RUNNER_TEMP/verified-signatures"
          mkdir -m 0700 "$verified"
          for signature in "$signatures"/*.qualification.json.sig; do
            name=$(basename "$signature")
            gh release download "$candidate_tag" --dir "$verified" --pattern "$name"
            cmp --silent "$signature" "$verified/$name"
          done
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$candidate_tag" > "$RUNNER_TEMP/signed-candidate.json"
          python3 - "$RUNNER_TEMP/signed-candidate.json" "$version" "$PREPARED_COMMIT" <<'PY'
          import json, re, sys
          source, version, commit = sys.argv[1:]
          with open(source, encoding="utf-8") as handle:
              release = json.load(handle)
          archives = {f"s46_{version}_{platform}.tar.gz" for platform in ("darwin_amd64", "darwin_arm64", "linux_amd64", "linux_arm64")}
          evidence = {name + ".qualification.json" for name in archives}
          signatures = {name + ".sig" for name in evidence}
          expected = archives | {"checksums.txt", "release-build.json", "release-build.json.sig"} | evidence | signatures
          assets = release.get("assets", [])
          names = [asset.get("name") for asset in assets if isinstance(asset, dict)]
          ids = [asset.get("id") for asset in assets if isinstance(asset, dict)]
          if release.get("draft") is not True or release.get("target_commitish") != commit or len(names) != len(assets) or len(names) != len(set(names)) or set(names) != expected or len(ids) != len(assets) or len(ids) != len(set(ids)):
              raise SystemExit("signed candidate cohort is not exact after signature publication")
          digest = re.compile(r"sha256:[0-9a-f]{64}")
          for asset in assets:
              name, identifier, size, asset_digest = asset.get("name"), asset.get("id"), asset.get("size"), asset.get("digest")
              maximum = 256 if name in signatures else 1048576 if name in evidence or name in {"checksums.txt", "release-build.json", "release-build.json.sig"} else 268435456
              if asset.get("state") != "uploaded" or not isinstance(identifier, int) or isinstance(identifier, bool) or identifier <= 0 or not isinstance(size, int) or isinstance(size, bool) or size <= 0 or size > maximum or not isinstance(asset_digest, str) or not digest.fullmatch(asset_digest):
                  raise SystemExit(f"signed candidate metadata is invalid for {name!r}")
          PY

  authority-qualified:
    name: atomically append the eight qualification assets
    needs: qualification-signature-publisher
    if: inputs.target == 'qualification-signatures' && needs.qualification-signature-publisher.result == 'success'
    runs-on: ubuntu-24.04
    environment: cli-release-authority-stage
    permissions:
      actions: read
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.prepared_commit }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - name: Verify protected stage policy before qualification append
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AUTHORITY_POLICY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh api "repos/$GITHUB_REPOSITORY/environments/cli-release-authority-stage" > "$RUNNER_TEMP/stage-environment.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" > "$RUNNER_TEMP/stage-approvals.json"
          jq -e '.can_admins_bypass == false and (.protection_rules | length) == 1 and .protection_rules[0].type == "required_reviewers" and .protection_rules[0].prevent_self_review == true and ([.protection_rules[0].reviewers[] | select(.type == "User") | .reviewer.login] | sort) == ["fredoliveira", "goncalossilva"]' "$RUNNER_TEMP/stage-environment.json" >/dev/null
          jq -e 'any(.[]; (.state | ascii_downcase) == "approved" and (.user.login == "fredoliveira" or .user.login == "goncalossilva") and any(.environments[]?; .name == "cli-release-authority-stage"))' "$RUNNER_TEMP/stage-approvals.json" >/dev/null
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .protected)" = true
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main/protection" --jq '.enforce_admins.enabled and .required_linear_history.enabled and (.allow_force_pushes.enabled | not) and (.allow_deletions.enabled | not) and .required_status_checks.strict and any(.required_status_checks.checks[]?; .context == "test" and .app_id == 15368) and .required_pull_request_reviews.dismiss_stale_reviews and (.required_pull_request_reviews.required_approving_review_count >= 1) and .required_pull_request_reviews.require_last_push_approval and .required_conversation_resolution.enabled')" = true
          test "$(gh api "repos/$GITHUB_REPOSITORY/immutable-releases" --jq .enabled)" = true
          gh api "repos/$GITHUB_REPOSITORY/rulesets?per_page=100" > "$RUNNER_TEMP/tag-rulesets.json"
          ruleset_id=$(jq -er --arg repository "$GITHUB_REPOSITORY" '[.[] | select(.name == "Immutable semantic release tags" and .target == "tag" and .source_type == "Repository" and .source == $repository and .enforcement == "active")] | if length == 1 then .[0].id else error("missing or ambiguous immutable tag ruleset") end' "$RUNNER_TEMP/tag-rulesets.json")
          gh api "repos/$GITHUB_REPOSITORY/rulesets/$ruleset_id" > "$RUNNER_TEMP/tag-ruleset.json"
          jq -e --argjson id "$ruleset_id" --arg repository "$GITHUB_REPOSITORY" '
            .id == $id and .name == "Immutable semantic release tags" and .target == "tag" and
            .source_type == "Repository" and .source == $repository and .enforcement == "active" and
            .bypass_actors == [] and .current_user_can_bypass == "never" and
            .conditions.ref_name == {exclude:[],include:["refs/tags/v*.*.*"]} and
            ([.rules[].type] | sort) == ["deletion","update"]
          ' "$RUNNER_TEMP/tag-ruleset.json" >/dev/null
      - name: Append the exact qualified cohort as sequence 3
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PREPARED_COMMIT: ${{ inputs.prepared_commit }}
          AUTHORITY_SSH_TARGET: ${{ vars.AUTHORITY_STAGE_SSH_TARGET }}
          AUTHORITY_STAGE_SSH_KEY: ${{ secrets.AUTHORITY_STAGE_SSH_KEY }}
          AUTHORITY_STAGE_KNOWN_HOSTS: ${{ secrets.AUTHORITY_STAGE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          cleanup_authority_credentials() {
            cleanup_status=0
            rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts" || cleanup_status=$?
            unset AUTHORITY_SSH_TARGET AUTHORITY_STAGE_SSH_KEY AUTHORITY_STAGE_KNOWN_HOSTS
            return "$cleanup_status"
          }
          trap cleanup_authority_credentials EXIT
          test -n "$AUTHORITY_STAGE_SSH_KEY"
          test -n "$AUTHORITY_STAGE_KNOWN_HOSTS"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$AUTHORITY_STAGE_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$AUTHORITY_STAGE_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          test "$GITHUB_REPOSITORY" = sovereign46/cli
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$PREPARED_COMMIT"
          test "$GITHUB_WORKFLOW_REF" = sovereign46/cli/.github/workflows/qualify-candidate.yml@refs/heads/main
          test "$(git rev-parse HEAD)" = "$PREPARED_COMMIT"
          git fetch --quiet --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$PREPARED_COMMIT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -n "$AUTHORITY_SSH_TARGET"
          version=${RELEASE_TAG#v}
          candidate_tag="candidate-$RELEASE_TAG-$PREPARED_COMMIT"
          bundle="$RUNNER_TEMP/qualified-cohort"
          mkdir -m 0700 "$bundle"
          for archive in \
            "s46_${version}_darwin_amd64.tar.gz" \
            "s46_${version}_darwin_arm64.tar.gz" \
            "s46_${version}_linux_amd64.tar.gz" \
            "s46_${version}_linux_arm64.tar.gz"; do
            for asset in "$archive" "$archive.qualification.json" "$archive.qualification.json.sig"; do
              gh release download "$candidate_tag" --dir "$bundle" --pattern "$asset"
            done
          done
          for asset in checksums.txt release-build.json release-build.json.sig; do
            gh release download "$candidate_tag" --dir "$bundle" --pattern "$asset"
          done
          go run ./scripts check-bundle "$RELEASE_TAG" "$PREPARED_COMMIT" "$bundle"
          release_id=$(PYTHONPATH=scripts python3 -c 'import sys; from release_authority import release_id; print(release_id("sovereign46/cli", sys.argv[1]))' "$RELEASE_TAG")
          current="$RUNNER_TEMP/current.json"
          current_etag="$RUNNER_TEMP/current.etag"
          scripts/release_authority.py capture --kind candidate --id "$release_id" --record-output "$current" --etag-output "$current_etag"
          expected_one="$RUNNER_TEMP/sequence-1.json"
          expected_two="$RUNNER_TEMP/sequence-2.json"
          expected_three="$RUNNER_TEMP/sequence-3.json"
          scripts/cli_release_authority.py qualified-recovery-records \
            --tag "$RELEASE_TAG" --commit "$PREPARED_COMMIT" --source-tree "$(git rev-parse HEAD^{tree})" \
            --bundle "$bundle" --sequence-one-output "$expected_one" \
            --sequence-two-output "$expected_two" --sequence-three-output "$expected_three"
          sequence=$(jq -er .sequence "$current")
          if test "$sequence" = 2; then
            cmp -s "$current" "$expected_two"
            cmp -s "$current_etag" "$expected_two.etag"
          elif test "$sequence" = 3; then
            cmp -s "$current" "$expected_three"
            cmp -s "$current_etag" "$expected_three.etag"
          else
            echo "authority candidate is outside the exact qualified recovery profile" >&2
            exit 1
          fi
          authority=(--ssh-host "$AUTHORITY_SSH_TARGET" --ssh-key "$HOME/.ssh/id_ed25519" --known-hosts "$HOME/.ssh/known_hosts")
          for asset in "$bundle"/*.qualification.json "$bundle"/*.qualification.json.sig; do
            scripts/release_authority.py put-blob "${authority[@]}" --file "$asset"
          done
          if test "$sequence" = 2; then
            scripts/release_authority.py append "${authority[@]}" \
              --record "$expected_three" --if-match "$(<"$current_etag")" --response-output "$RUNNER_TEMP/replaced.json"
          fi
          cleanup_authority_credentials
          trap - EXIT
          scripts/release_authority.py capture --kind candidate --id "$release_id" \
            --record-output "$RUNNER_TEMP/final.json" --etag-output "$RUNNER_TEMP/final.etag"
          cmp -s "$RUNNER_TEMP/final.json" "$expected_three"
          cmp -s "$RUNNER_TEMP/final.etag" "$expected_three.etag"
