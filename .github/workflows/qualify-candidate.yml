name: qualify candidate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Final semantic release tag (for example v0.3.0)
        required: true
        type: string
      prepared_commit:
        description: Exact full origin/main commit used to build the candidate
        required: true
        type: string
      authority_stage_run_id:
        description: Successful stage-release-authority workflow run ID; required for native qualification
        required: false
        type: string
      authority_stage_artifact_id:
        description: Exact immutable stage handoff artifact ID from that run; required for native qualification
        required: false
        type: string
      target:
        description: Native target to qualify; reruns never replace existing evidence
        required: true
        default: all
        type: choice
        options:
          - all
          - darwin-amd64
          - darwin-arm64-airplane
          - linux-amd64
          - linux-arm64
          - qualification-signatures
      qualification_signatures:
        description: JSON object mapping each qualification signature asset name to its one-line base64 signature; required only for qualification-signatures
        required: false
        type: string

permissions:
  actions: read
  contents: read
  deployments: read

env:
  GH_REPO: ${{ github.repository }}

concurrency:
  # Share one cross-commit writer lock with final publication. Candidate asset
  # probes and append-only publishers must not race a release/Homebrew writer.
  group: release-homebrew-writer
  cancel-in-progress: false

jobs:
  authority-candidate:
    name: verify exact sequence-2 authority candidate
    if: inputs.target != 'qualification-signatures'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      release_id: ${{ steps.authority.outputs.release_id }}
      candidate_etag: ${{ steps.authority.outputs.candidate_etag }}
      candidate_record_sha256: ${{ steps.authority.outputs.candidate_record_sha256 }}
      source_tree: ${{ steps.authority.outputs.source_tree }}
      build_receipt_sha256: ${{ steps.authority.outputs.build_receipt_sha256 }}
      build_signature_sha256: ${{ steps.authority.outputs.build_signature_sha256 }}
      stale_if_match_status: ${{ steps.authority.outputs.stale_if_match_status }}
    steps:
      - name: Verify and extract the immutable attempt-qualified stage handoff
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PREPARED_COMMIT: ${{ inputs.prepared_commit }}
          STAGE_RUN_ID: ${{ inputs.authority_stage_run_id }}
          STAGE_ARTIFACT_ID: ${{ inputs.authority_stage_artifact_id }}
        run: |
          set -euo pipefail
          [[ "$STAGE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$STAGE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          run="$RUNNER_TEMP/stage-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STAGE_RUN_ID" > "$run"
          jq -e --arg repository "$GITHUB_REPOSITORY" --arg commit "$PREPARED_COMMIT" '
            .event == "workflow_dispatch" and .status == "completed" and .conclusion == "success" and
            .path == ".github/workflows/stage-release-authority.yml" and .head_sha == $commit and
            .head_branch == "main" and .head_repository.full_name == $repository and
            (.run_attempt | type == "number" and . >= 1 and floor == .)
          ' "$run" >/dev/null
          run_attempt=$(jq -er '.run_attempt | tostring' "$run")
          artifacts="$RUNNER_TEMP/stage-artifacts.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STAGE_RUN_ID/artifacts?per_page=100" > "$artifacts"
          expected_name="cli-release-authority-stage-$RELEASE_TAG-$PREPARED_COMMIT-$run_attempt"
          artifact_digest=$(jq -er --argjson id "$STAGE_ARTIFACT_ID" --arg name "$expected_name" \
            --argjson run "$STAGE_RUN_ID" --arg commit "$PREPARED_COMMIT" '
            [.artifacts[] | select(.id == $id)] as $selected |
            if .total_count == (.artifacts | length) and .total_count <= 100 and ($selected | length) == 1 and
               ($selected[0].expired | not) and $selected[0].name == $name and
               $selected[0].workflow_run.id == $run and $selected[0].workflow_run.head_sha == $commit and
               ($selected[0].digest | test("^sha256:[0-9a-f]{64}$"))
            then $selected[0].digest[7:]
            else error("stage run does not contain the one exact attempt-qualified handoff") end
          ' "$artifacts")
          zip="$RUNNER_TEMP/stage-handoff.zip"
          curl --fail --location --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$zip" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$STAGE_ARTIFACT_ID/zip"
          test "$(wc -c < "$zip" | tr -d '[:space:]')" -le 2097152
          test "$(sha256sum "$zip" | cut -d' ' -f1)" = "$artifact_digest"
          handoff="$RUNNER_TEMP/authority-stage-handoff"
          mkdir -m 0700 "$handoff"
          python3 - "$zip" "$handoff" <<'PY'
          import os, pathlib, stat, sys, zipfile
          archive, destination = sys.argv[1:]
          expected = {"candidate-record.json", "candidate.etag", "handoff.json"}
          with zipfile.ZipFile(archive) as source:
              members = source.infolist()
              if {member.filename for member in members} != expected or len(members) != len(expected):
                  raise SystemExit("stage handoff artifact has an unexpected file cohort")
              for member in members:
                  mode = member.external_attr >> 16
                  if pathlib.PurePosixPath(member.filename).name != member.filename or stat.S_ISLNK(mode) or member.file_size <= 0 or member.file_size > 1048576 or member.flag_bits & 1:
                      raise SystemExit("stage handoff artifact has unsafe metadata")
                  raw = source.read(member)
                  if len(raw) != member.file_size:
                      raise SystemExit("stage handoff artifact member is truncated")
                  descriptor = os.open(pathlib.Path(destination) / member.filename, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
                  with os.fdopen(descriptor, "wb") as output:
                      output.write(raw)
          PY
          jq -cS . "$handoff/handoff.json" > "$RUNNER_TEMP/canonical-handoff.json"
          cmp -s "$RUNNER_TEMP/canonical-handoff.json" "$handoff/handoff.json"
          record_sha=$(sha256sum "$handoff/candidate-record.json" | cut -d' ' -f1)
          release_id=$(python3 -c 'import hashlib,sys; print("sha256-"+hashlib.sha256(b"s46/release-authority-id/v1\\x00sovereign46/cli\\x00"+sys.argv[1].encode("ascii")).hexdigest())' "$RELEASE_TAG")
          jq -e --arg run "$STAGE_RUN_ID" --arg attempt "$run_attempt" --arg tag "$RELEASE_TAG" --arg commit "$PREPARED_COMMIT" --arg id "$release_id" --arg record "$record_sha" --arg etag "$(<"$handoff/candidate.etag")" '
            . == {schema:"s46.cli-release-authority-stage.v1",workflowRef:"sovereign46/cli/.github/workflows/stage-release-authority.yml@refs/heads/main",runId:$run,runAttempt:$attempt,tag:$tag,commit:$commit,sourceTree:.sourceTree,releaseAuthorityOrigin:"https://models.s46.dev/release-authority/v1",releaseAuthorityId:$id,candidateSequence:2,candidateEtag:$etag,candidateRecordSha256:$record,staleIfMatchStatus:412,buildReceiptSha256:.buildReceiptSha256,buildSignatureSha256:.buildSignatureSha256} and
            (.sourceTree | test("^(?:[0-9a-f]{40}|[0-9a-f]{64})$")) and
            (.buildReceiptSha256 | test("^[0-9a-f]{64}$")) and (.buildSignatureSha256 | test("^[0-9a-f]{64}$"))
          ' "$handoff/handoff.json" >/dev/null
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.prepared_commit }}
          fetch-depth: 1
          persist-credentials: false
      - name: Capture and verify the deterministic qualification head
        id: authority
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          PREPARED_COMMIT: ${{ inputs.prepared_commit }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = sovereign46/cli
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$PREPARED_COMMIT"
          test "$GITHUB_WORKFLOW_REF" = sovereign46/cli/.github/workflows/qualify-candidate.yml@refs/heads/main
          test "$(git rev-parse HEAD)" = "$PREPARED_COMMIT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          source_tree=$(git rev-parse HEAD^{tree})
          release_id=$(PYTHONPATH=scripts python3 -c 'import sys; from release_authority import release_id; print(release_id("sovereign46/cli", sys.argv[1]))' "$RELEASE_TAG")
          work="$RUNNER_TEMP/authority-candidate"
          mkdir -m 0700 "$work"
          scripts/release_authority.py capture --kind candidate --id "$release_id" \
            --record-output "$work/candidate.json" --etag-output "$work/candidate.etag"
          handoff="$RUNNER_TEMP/authority-stage-handoff"
          cmp -s "$work/candidate.json" "$handoff/candidate-record.json"
          cmp -s "$work/candidate.etag" "$handoff/candidate.etag"
          version=${RELEASE_TAG#v}
          jq -e --arg id "$release_id" --arg tag "$RELEASE_TAG" --arg commit "$PREPARED_COMMIT" --arg tree "$source_tree" '
            .schema == "s46.release-authority.record.v1" and .id == $id and .state == "candidate" and
            .sequence == 2 and .source.repository == "sovereign46/cli" and .source.tag == $tag and
            .source.commit == $commit and .source.tagObject == "" and (.source.bundleSha256 | test("^[0-9a-f]{64}$")) and
            ([.annotations[] | select(.name == "build-receipt-sha256")][0].value == .source.bundleSha256) and
            ([.annotations[] | select(.name == "cas-probe")][0].value == "sequence-2") and
            ([.annotations[] | select(.name == "source-tree")][0].value == $tree)
          ' "$work/candidate.json" >/dev/null
          test "$(jq '.assets | length' "$work/candidate.json")" -eq 7
          record_sha=$(sha256sum "$work/candidate.json" | cut -d' ' -f1)
          candidate_etag=$(<"$work/candidate.etag")
          build_receipt_sha=$(jq -er '.source.bundleSha256' "$work/candidate.json")
          build_signature_sha=$(jq -er '[.annotations[] | select(.name == "build-signature-sha256")][0].value' "$work/candidate.json")
          jq -e --arg receipt "$build_receipt_sha" --arg signature "$build_signature_sha" '
            ([.assets[] | select(.name == "release-build.json")][0].sha256 == $receipt) and
            ([.assets[] | select(.name == "release-build.json.sig")][0].sha256 == $signature)
          ' "$work/candidate.json" >/dev/null
          jq -e --arg id "$release_id" --arg etag "$candidate_etag" --arg record "$record_sha" --arg tree "$source_tree" --arg receipt "$build_receipt_sha" --arg signature "$build_signature_sha" '
            .releaseAuthorityId == $id and .candidateSequence == 2 and .candidateEtag == $etag and
            .candidateRecordSha256 == $record and .sourceTree == $tree and
            .buildReceiptSha256 == $receipt and .buildSignatureSha256 == $signature and .staleIfMatchStatus == 412
          ' "$handoff/handoff.json" >/dev/null
          stale_status=$(jq -er '.staleIfMatchStatus' "$handoff/handoff.json")
          {
            printf 'release_id=%s\n' "$release_id"
            printf 'candidate_etag=%s\n' "$candidate_etag"
            printf 'candidate_record_sha256=%s\n' "$record_sha"
            printf 'source_tree=%s\n' "$source_tree"
            printf 'build_receipt_sha256=%s\n' "$build_receipt_sha"
            printf 'build_signature_sha256=%s\n' "$build_signature_sha"
            printf 'stale_if_match_status=%s\n' "$stale_status"
          } >> "$GITHUB_OUTPUT"

  native-cloud:
    name: cloud-client / ${{ matrix.target }}
    needs: authority-candidate
    if: inputs.target != 'qualification-signatures' && needs.authority-candidate.result == 'success' && ( inputs.target == 'all' || inputs.target == 'darwin-amd64' || inputs.target == 'linux-amd64' || inputs.target == 'linux-arm64')
    permissions:
      actions: read
      contents: read
      deployments: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - target: darwin-amd64
            runner: macos-15-intel
            archive_platform: darwin_amd64
          - target: linux-amd64
            runner: ubuntu-24.04
            archive_platform: linux_amd64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            archive_platform: linux_arm64
    runs-on: ${{ matrix.runner }}
    environment: cloud-qualification
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        if: inputs.target == 'all' || inputs.target == matrix.target
        with:
          ref: ${{ inputs.prepared_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        if: inputs.target == 'all' || inputs.target == matrix.target
        with:
          go-version-file: go.mod
      - name: Bind protected environment approval and ephemeral hosted runner identity
        if: inputs.target == 'all' || inputs.target == matrix.target
        id: provenance
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUALIFICATION_ENVIRONMENT: cloud-qualification
        run: |
          set -euo pipefail
          approvals="$RUNNER_TEMP/environment-approvals.json"
          policy="$RUNNER_TEMP/environment-policy.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" > "$approvals"
          gh api "repos/$GITHUB_REPOSITORY/environments/$QUALIFICATION_ENVIRONMENT" > "$policy"
          python3 - "$approvals" "$policy" "$RUNNER_TEMP/provenance.json" <<'PY'
          import hashlib, json, os, platform, sys
          approvals_path, policy_path, output_path = sys.argv[1:]
          with open(approvals_path, encoding="utf-8") as source:
              approvals = json.load(source)
          with open(policy_path, encoding="utf-8") as source:
              policy = json.load(source)
          environment = os.environ["QUALIFICATION_ENVIRONMENT"]
          reviewer_rules = [rule for rule in policy.get("protection_rules", []) if rule.get("type") == "required_reviewers"]
          reviewers = sorted(item.get("reviewer", {}).get("login", "") for item in reviewer_rules[0].get("reviewers", [])) if len(reviewer_rules) == 1 else []
          if policy.get("can_admins_bypass") is not False or len(policy.get("protection_rules", [])) != 1 or len(reviewer_rules) != 1 or reviewer_rules[0].get("prevent_self_review") is not True or reviewers != ["goncalossilva"]:
              raise SystemExit("qualification environment protection does not exactly match the approved policy")
          approved = [review for review in approvals if review.get("state", "").lower() == "approved" and review.get("user", {}).get("login") == "goncalossilva" and any(item.get("name") == environment for item in review.get("environments", []))]
          if not approved:
              raise SystemExit("qualification run lacks approval from goncalossilva")
          approver = "goncalossilva"
          identity = {
              "schema": "s46.qualification-execution-provenance.v1",
              "environment": environment,
              "approval": approved[-1],
              "environmentPolicy": {"canAdminsBypass": False, "preventSelfReview": True, "reviewers": reviewers},
              "runner": {
                  "ephemeral": True,
                  "environment": os.environ["RUNNER_ENVIRONMENT"],
                  "name": os.environ["RUNNER_NAME"],
                  "os": os.environ["RUNNER_OS"],
                  "arch": os.environ["RUNNER_ARCH"],
                  "runId": os.environ["GITHUB_RUN_ID"],
                  "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              },
          }
          raw = (json.dumps(identity, sort_keys=True, separators=(",", ":")) + "\n").encode()
          with open(output_path, "xb") as output:
              output.write(raw)
          approval = hashlib.sha256(raw).hexdigest()
          runner_raw = (json.dumps(identity["runner"], sort_keys=True, separators=(",", ":")) + "\n").encode()
          runner = hashlib.sha256(runner_raw).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"approval_sha256={approval}\nrunner_identity_sha256={runner}\napprover={approver}\n")
              output.write(f"os_version={platform.mac_ver()[0] if platform.system() == 'Darwin' else platform.platform()}\n")
          PY
      - name: Download and verify the exact create-only candidate build
        if: inputs.target == 'all' || inputs.target == matrix.target
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PREPARED_COMMIT: ${{ inputs.prepared_commit }}
          ARCHIVE_PLATFORM: ${{ matrix.archive_platform }}
          AUTHORITY_ID: ${{ needs.authority-candidate.outputs.release_id }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$PREPARED_COMMIT" =~ ^[0-9a-f]{40}$|^[0-9a-f]{64}$ ]]
          test "$GITHUB_SHA" = "$PREPARED_COMMIT"
          test "$(git rev-parse HEAD)" = "$PREPARED_COMMIT"
          git fetch --quiet --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$PREPARED_COMMIT"
          version=${RELEASE_TAG#v}
          bundle="$RUNNER_TEMP/candidate-build"
          mkdir -m 0700 "$bundle"
          for asset in \
            "s46_${version}_darwin_amd64.tar.gz" \
            "s46_${version}_darwin_arm64.tar.gz" \
            "s46_${version}_linux_amd64.tar.gz" \
            "s46_${version}_linux_arm64.tar.gz" \
            checksums.txt release-build.json release-build.json.sig; do
            scripts/release_authority.py download --kind candidate --id "$AUTHORITY_ID" --asset "$asset" --output "$bundle/$asset"
          done
          go run ./scripts check-candidate "$RELEASE_TAG" "$PREPARED_COMMIT" "$bundle"
          archive="$bundle/s46_${version}_${ARCHIVE_PLATFORM}.tar.gz"
          evidence="$RUNNER_TEMP/$(basename "$archive").qualification.json"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'bundle=%s\n' "$bundle" >> "$GITHUB_OUTPUT"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"
          printf 'evidence=%s\n' "$evidence" >> "$GITHUB_OUTPUT"
      - name: Qualify cloud-client behavior on the native OS and architecture
        if: inputs.target == 'all' || inputs.target == matrix.target
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION: ${{ steps.candidate.outputs.version }}
          PREPARED_COMMIT: ${{ inputs.prepared_commit }}
          ARCHIVE: ${{ steps.candidate.outputs.archive }}
          EVIDENCE: ${{ steps.candidate.outputs.evidence }}
          S46_E2E_RUNNER_OS: ${{ runner.os }}
          S46_E2E_RUNNER_ARCH: ${{ runner.arch }}
          S46_E2E_OS_VERSION: ${{ steps.provenance.outputs.os_version }}
          S46_E2E_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          S46_E2E_RUNNER_NAME: ${{ runner.name }}
          S46_E2E_WORKFLOW_REF: ${{ github.workflow_ref }}
          S46_E2E_WORKFLOW_SHA: ${{ github.sha }}
          S46_E2E_RUN_ID: ${{ github.run_id }}
          S46_E2E_RUN_ATTEMPT: ${{ github.run_attempt }}
          S46_E2E_ENVIRONMENT: cloud-qualification
          S46_E2E_ENVIRONMENT_APPROVER: ${{ steps.provenance.outputs.approver }}
          S46_E2E_ENVIRONMENT_REVIEWERS: goncalossilva
          S46_E2E_ENVIRONMENT_PREVENT_SELF_REVIEW: "true"
          S46_E2E_ENVIRONMENT_ADMINS_BYPASS: "false"
          S46_E2E_SOURCE_TREE: ${{ needs.authority-candidate.outputs.source_tree }}
          S46_E2E_BUILD_RECEIPT_SHA256: ${{ needs.authority-candidate.outputs.build_receipt_sha256 }}
          S46_E2E_BUILD_SIGNATURE_SHA256: ${{ needs.authority-candidate.outputs.build_signature_sha256 }}
          S46_E2E_RELEASE_AUTHORITY_ORIGIN: https://models.s46.dev/release-authority/v1
          S46_E2E_RELEASE_AUTHORITY_ID: ${{ needs.authority-candidate.outputs.release_id }}
          S46_E2E_CANDIDATE_SEQUENCE: "2"
          S46_E2E_CANDIDATE_ETAG: ${{ needs.authority-candidate.outputs.candidate_etag }}
          S46_E2E_CANDIDATE_RECORD_SHA256: ${{ needs.authority-candidate.outputs.candidate_record_sha256 }}
          S46_E2E_CANDIDATE_STALE_IF_MATCH_STATUS: ${{ needs.authority-candidate.outputs.stale_if_match_status }}
          S46_E2E_ENVIRONMENT_APPROVAL_SHA256: ${{ steps.provenance.outputs.approval_sha256 }}
          S46_E2E_RUNNER_IDENTITY_SHA256: ${{ steps.provenance.outputs.runner_identity_sha256 }}
        run: |
          set -euo pipefail
          scripts/qualify-cloud-native "$ARCHIVE" "$EVIDENCE" "$VERSION" "$PREPARED_COMMIT"
          go run ./scripts check-qualification "$RELEASE_TAG" "$PREPARED_COMMIT" "$ARCHIVE" "$EVIDENCE"
      - name: Upload immutable qualification evidence artifact
        if: inputs.target == 'all' || inputs.target == matrix.target
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualification-${{ matrix.target }}-${{ github.run_attempt }}
          path: ${{ steps.candidate.outputs.evidence }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false

  qualification-signature-validation:
    name: validate independently produced qualification signatures
    if: inputs.target == 'qualification-signatures'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_id: ${{ steps.signatures.outputs.artifact-id }}
      artifact_digest: ${{ steps.signatures.outputs.artifact-digest }}
      artifact_name: ${{ steps.signature-handoff.outputs.name }}
      producer_attempt: ${{ steps.signature-handoff.outputs.attempt }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.prepared_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - name: Validate, append once, and re-fetch the signed qualification cohort
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PREPARED_COMMIT: ${{ inputs.prepared_commit }}
          SIGNATURES: ${{ inputs.qualification_signatures }}
        run: |
          set -euo pipefail
          test -n "$SIGNATURES"
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$PREPARED_COMMIT"
          test "$GITHUB_WORKFLOW_REF" = "sovereign46/cli/.github/workflows/qualify-candidate.yml@refs/heads/main"
          test "$(git rev-parse HEAD)" = "$PREPARED_COMMIT"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$PREPARED_COMMIT"
          candidate_tag="candidate-$RELEASE_TAG-$PREPARED_COMMIT"
          candidate_before="$RUNNER_TEMP/signature-candidate-before.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$candidate_tag" > "$candidate_before"
          python3 - "$candidate_before" "$candidate_tag" "$PREPARED_COMMIT" "${RELEASE_TAG#v}" <<'PY'
          import json, re, sys
          source, tag, commit, version = sys.argv[1:]
          with open(source, encoding="utf-8") as handle:
              release = json.load(handle)
          archives = {f"s46_{version}_{platform}.tar.gz" for platform in ("darwin_amd64", "darwin_arm64", "linux_amd64", "linux_arm64")}
          build = archives | {"checksums.txt", "release-build.json", "release-build.json.sig"}
          evidence = {name + ".qualification.json" for name in archives}
          signatures = {name + ".sig" for name in evidence}
          assets = release.get("assets", [])
          names = [asset.get("name") for asset in assets if isinstance(asset, dict)]
          ids = [asset.get("id") for asset in assets if isinstance(asset, dict)]
          if release.get("draft") is not True or release.get("tag_name") != tag or release.get("target_commitish") != commit:
              raise SystemExit("signature validation candidate identity is invalid")
          if len(names) != len(assets) or len(names) != len(set(names)) or len(ids) != len(assets) or len(ids) != len(set(ids)):
              raise SystemExit("signature validation candidate has malformed or duplicate assets")
          present = set(names)
          if not build.issubset(present) or not evidence.issubset(present) or present - build - evidence - signatures:
              raise SystemExit("signatures require the exact build and complete native evidence cohort")
          digest = re.compile(r"sha256:[0-9a-f]{64}")
          for asset in assets:
              name, identifier, size, asset_digest, state = asset.get("name"), asset.get("id"), asset.get("size"), asset.get("digest"), asset.get("state")
              maximum = 256 if name in signatures else 1048576 if name in evidence or name in {"checksums.txt", "release-build.json", "release-build.json.sig"} else 268435456
              if not isinstance(identifier, int) or isinstance(identifier, bool) or identifier <= 0:
                  raise SystemExit(f"signature validation candidate identity is invalid for {name!r}")
              if state == "starter":
                  if name not in signatures or size != 0 or asset_digest is not None:
                      raise SystemExit(f"signature validation found an unrecoverable incomplete asset for {name!r}")
              elif state != "uploaded" or not isinstance(size, int) or isinstance(size, bool) or size <= 0 or size > maximum or not isinstance(asset_digest, str) or not digest.fullmatch(asset_digest):
                  raise SystemExit(f"signature validation candidate metadata is invalid for {name!r}")
          PY
          bundle="$RUNNER_TEMP/signed-candidate"
          mkdir -m 0700 "$bundle"
          version="${RELEASE_TAG#v}"
          for asset in \
            "s46_${version}_darwin_amd64.tar.gz" \
            "s46_${version}_darwin_arm64.tar.gz" \
            "s46_${version}_linux_amd64.tar.gz" \
            "s46_${version}_linux_arm64.tar.gz" \
            checksums.txt release-build.json release-build.json.sig \
            "s46_${version}_darwin_amd64.tar.gz.qualification.json" \
            "s46_${version}_darwin_arm64.tar.gz.qualification.json" \
            "s46_${version}_linux_amd64.tar.gz.qualification.json" \
            "s46_${version}_linux_arm64.tar.gz.qualification.json"; do
            gh release download "$candidate_tag" --dir "$bundle" --pattern "$asset"
          done
          python3 - "$bundle" "$version" "$SIGNATURES" <<'PY'
          import base64, binascii, json, os, pathlib, re, sys
          bundle, version, raw = pathlib.Path(sys.argv[1]), sys.argv[2], sys.argv[3]
          signatures = json.loads(raw)
          expected = {f"s46_{version}_{platform}.tar.gz.qualification.json.sig" for platform in ("darwin_amd64", "darwin_arm64", "linux_amd64", "linux_arm64")}
          if set(signatures) != expected or not all(isinstance(value, str) and re.fullmatch(r"[A-Za-z0-9+/]+={0,2}", value) for value in signatures.values()):
              raise SystemExit("signature input must contain exactly four canonical qualification signature assets")
          for name, value in signatures.items():
              try:
                  decoded = base64.b64decode(value, validate=True)
              except (ValueError, binascii.Error) as error:
                  raise SystemExit(f"invalid base64 signature {name}: {error}")
              if len(decoded) != 64 or base64.b64encode(decoded).decode() != value:
                  raise SystemExit(f"qualification signature {name} is not one canonical Ed25519 signature")
              descriptor = os.open(bundle / name, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
              with os.fdopen(descriptor, "w", encoding="ascii") as output:
                  output.write(value + "\n")
          PY
          go run ./scripts check-bundle "$RELEASE_TAG" "$PREPARED_COMMIT" "$bundle"
          mkdir -m 0700 "$RUNNER_TEMP/validated-signatures"
          cp "$bundle"/*.qualification.json.sig "$RUNNER_TEMP/validated-signatures/"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$candidate_tag" \
            | jq -S '{id, tag_name, target_commitish, draft, updated_at, assets: [.assets[] | {id, name, size, digest, updated_at}] | sort_by(.name)}' \
            > "$RUNNER_TEMP/validated-signatures/candidate-ledger.json"
      - name: Bind the producer-qualified signature artifact name
        id: signature-handoff
        shell: bash
        run: |
          set -euo pipefail
          printf 'name=validated-qualification-signatures-%s\nattempt=%s\n' \
            "$GITHUB_RUN_ATTEMPT" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Upload immutable validated-signatures artifact
        id: signatures
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.signature-handoff.outputs.name }}
          path: ${{ runner.temp }}/validated-signatures
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false

  darwin-arm64-airplane:
    name: airplane / darwin-arm64
    needs: [authority-candidate, native-cloud]
    if: always() && needs.authority-candidate.result == 'success' && (inputs.target == 'all' || inputs.target == 'darwin-arm64-airplane') && (needs.native-cloud.result == 'success' || needs.native-cloud.result == 'skipped')
    permissions:
      actions: read
      contents: read
      deployments: read
    runs-on: [self-hosted, macOS, ARM64, s46-airplane-qualification]
    environment: airplane-qualification
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.prepared_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - name: Bind protected approval and ephemeral self-hosted runner contract
        id: provenance
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUALIFICATION_ENVIRONMENT: airplane-qualification
          RUNNER_IDENTITY: ${{ vars.S46_AIRPLANE_RUNNER_IDENTITY }}
        run: |
          set -euo pipefail
          test -n "$RUNNER_IDENTITY" && test "${RUNNER_IDENTITY#/}" != "$RUNNER_IDENTITY"
          test -f "$RUNNER_IDENTITY" && test ! -L "$RUNNER_IDENTITY"
          test "$(stat -f '%Su' "$RUNNER_IDENTITY")" = root
          mode=$(stat -f '%Lp' "$RUNNER_IDENTITY")
          test $((8#$mode & 0022)) -eq 0
          approvals="$RUNNER_TEMP/environment-approvals.json"
          policy="$RUNNER_TEMP/environment-policy.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" > "$approvals"
          gh api "repos/$GITHUB_REPOSITORY/environments/$QUALIFICATION_ENVIRONMENT" > "$policy"
          python3 - "$approvals" "$policy" "$RUNNER_IDENTITY" "$RUNNER_TEMP/provenance.json" <<'PY'
          import datetime, hashlib, json, os, platform, sys
          approvals_path, policy_path, identity_path, output_path = sys.argv[1:]
          with open(approvals_path, encoding="utf-8") as source:
              approvals = json.load(source)
          with open(policy_path, encoding="utf-8") as source:
              policy = json.load(source)
          with open(identity_path, "rb") as source:
              identity_raw = source.read()
          identity = json.loads(identity_raw)
          environment = os.environ["QUALIFICATION_ENVIRONMENT"]
          rules = policy.get("protection_rules", [])
          reviewer_rules = [rule for rule in rules if rule.get("type") == "required_reviewers"]
          branch_rules = [rule for rule in rules if rule.get("type") == "branch_policy"]
          reviewers = sorted(item.get("reviewer", {}).get("login", "") for item in reviewer_rules[0].get("reviewers", [])) if len(reviewer_rules) == 1 else []
          deployment_policy = policy.get("deployment_branch_policy")
          if (policy.get("can_admins_bypass") is not False or len(rules) != 2 or len(reviewer_rules) != 1 or len(branch_rules) != 1 or
                  reviewer_rules[0].get("prevent_self_review") is not True or reviewers != ["goncalossilva"] or
                  deployment_policy != {"protected_branches": True, "custom_branch_policies": False}):
              raise SystemExit("airplane environment protection does not exactly match the approved reviewer and protected-branch policy")
          approved = [review for review in approvals if review.get("state", "").lower() == "approved" and review.get("user", {}).get("login") == "goncalossilva" and any(item.get("name") == environment for item in review.get("environments", []))]
          now = datetime.datetime.now(datetime.timezone.utc)
          expires = datetime.datetime.fromisoformat(identity.get("expiresAt", "").replace("Z", "+00:00"))
          if not approved:
              raise SystemExit("airplane run lacks approval from goncalossilva")
          approver = "goncalossilva"
          if identity.get("schema") != "s46.ephemeral-qualification-runner.v1" or identity.get("ephemeral") is not True or identity.get("destroyAfterRun") is not True:
              raise SystemExit("self-hosted runner does not provide the ephemeral destruction contract")
          if identity.get("runId") != os.environ["GITHUB_RUN_ID"] or identity.get("runAttempt") != os.environ["GITHUB_RUN_ATTEMPT"] or identity.get("runnerName") != os.environ["RUNNER_NAME"] or expires <= now:
              raise SystemExit("self-hosted runner identity is stale or belongs to another run")
          provenance = {"schema": "s46.qualification-execution-provenance.v1", "environment": environment, "approval": approved[-1], "environmentPolicy": {"canAdminsBypass": False, "preventSelfReview": True, "reviewers": reviewers, "branchPolicy": {"protectedBranches": True, "customBranchPolicies": False}}, "runner": identity}
          raw = (json.dumps(provenance, sort_keys=True, separators=(",", ":")) + "\n").encode()
          with open(output_path, "xb") as output:
              output.write(raw)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"approval_sha256={hashlib.sha256(raw).hexdigest()}\napprover={approver}\n")
              output.write(f"runner_identity_sha256={hashlib.sha256(identity_raw).hexdigest()}\n")
              output.write(f"os_version={platform.mac_ver()[0]}\n")
          PY
      - name: Download and verify the exact create-only candidate build
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PREPARED_COMMIT: ${{ inputs.prepared_commit }}
          AUTHORITY_ID: ${{ needs.authority-candidate.outputs.release_id }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$PREPARED_COMMIT" =~ ^[0-9a-f]{40}$|^[0-9a-f]{64}$ ]]
          test "$GITHUB_SHA" = "$PREPARED_COMMIT"
          test "$(git rev-parse HEAD)" = "$PREPARED_COMMIT"
          git fetch --quiet --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$PREPARED_COMMIT"
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          macos_major=$(sw_vers -productVersion | cut -d. -f1)
          test "$macos_major" = 26
          version=${RELEASE_TAG#v}
          bundle="$RUNNER_TEMP/candidate-build"
          mkdir -m 0700 "$bundle"
          for asset in \
            "s46_${version}_darwin_amd64.tar.gz" \
            "s46_${version}_darwin_arm64.tar.gz" \
            "s46_${version}_linux_amd64.tar.gz" \
            "s46_${version}_linux_arm64.tar.gz" \
            checksums.txt release-build.json release-build.json.sig; do
            scripts/release_authority.py download --kind candidate --id "$AUTHORITY_ID" --asset "$asset" --output "$bundle/$asset"
          done
          go run ./scripts check-candidate "$RELEASE_TAG" "$PREPARED_COMMIT" "$bundle"
          archive="$bundle/s46_${version}_darwin_arm64.tar.gz"
          evidence="$RUNNER_TEMP/$(basename "$archive").qualification.json"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'bundle=%s\n' "$bundle" >> "$GITHUB_OUTPUT"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"
          printf 'evidence=%s\n' "$evidence" >> "$GITHUB_OUTPUT"
      - name: Run the real three-harness airplane qualification in the approved external isolator
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION: ${{ steps.candidate.outputs.version }}
          PREPARED_COMMIT: ${{ inputs.prepared_commit }}
          ARCHIVE: ${{ steps.candidate.outputs.archive }}
          EVIDENCE: ${{ steps.candidate.outputs.evidence }}
          ISOLATOR: ${{ vars.S46_AIRPLANE_QUALIFICATION_ISOLATOR }}
          ISOLATOR_SHA256: ${{ vars.S46_AIRPLANE_QUALIFICATION_ISOLATOR_SHA256 }}
          MODEL_GGUF: ${{ vars.S46_E2E_MODEL_GGUF }}
          MODEL_SHA256: ${{ vars.S46_E2E_MODEL_SHA256 }}
          LLAMA_ARCHIVE: ${{ vars.S46_E2E_LLAMA_ARCHIVE }}
          LLAMA_ARCHIVE_SHA256: ${{ vars.S46_E2E_LLAMA_ARCHIVE_SHA256 }}
          LLAMA_SERVER_SHA256: ${{ vars.S46_E2E_LLAMA_SERVER_SHA256 }}
          LLAMA_INVENTORY_SHA256: ${{ vars.S46_E2E_LLAMA_INVENTORY_SHA256 }}
          GATEWAY_ARCHIVE: ${{ vars.S46_E2E_GATEWAY_ARCHIVE }}
          GATEWAY_ARCHIVE_SHA256: ${{ vars.S46_E2E_GATEWAY_ARCHIVE_SHA256 }}
          GATEWAY_SHA256: ${{ vars.S46_E2E_GATEWAY_SHA256 }}
          QUALIFICATION_APPROVAL_SHA256: ${{ steps.provenance.outputs.approval_sha256 }}
          QUALIFICATION_APPROVER: ${{ steps.provenance.outputs.approver }}
          RUNNER_IDENTITY_SHA256: ${{ steps.provenance.outputs.runner_identity_sha256 }}
          OS_VERSION: ${{ steps.provenance.outputs.os_version }}
          SOURCE_TREE: ${{ needs.authority-candidate.outputs.source_tree }}
          BUILD_RECEIPT_SHA256: ${{ needs.authority-candidate.outputs.build_receipt_sha256 }}
          BUILD_SIGNATURE_SHA256: ${{ needs.authority-candidate.outputs.build_signature_sha256 }}
          RELEASE_AUTHORITY_ID: ${{ needs.authority-candidate.outputs.release_id }}
          CANDIDATE_ETAG: ${{ needs.authority-candidate.outputs.candidate_etag }}
          CANDIDATE_RECORD_SHA256: ${{ needs.authority-candidate.outputs.candidate_record_sha256 }}
          CANDIDATE_STALE_IF_MATCH_STATUS: ${{ needs.authority-candidate.outputs.stale_if_match_status }}
        run: |
          set -euo pipefail
          test -n "$ISOLATOR" && test "${ISOLATOR#/}" != "$ISOLATOR"
          test -f "$ISOLATOR" && test ! -L "$ISOLATOR"
          test "$(stat -f '%Su' "$ISOLATOR")" = root
          mode=$(stat -f '%Lp' "$ISOLATOR")
          test $((8#$mode & 0022)) -eq 0
          test "$(shasum -a 256 "$ISOLATOR" | awk '{print $1}')" = "$ISOLATOR_SHA256"
          candidate_sha=$(shasum -a 256 "$ARCHIVE" | awk '{print $1}')
          mkdir -m 0700 "$RUNNER_TEMP/airplane-home" "$RUNNER_TEMP/airplane-tmp"
          "$ISOLATOR" /usr/bin/env -i \
            HOME="$RUNNER_TEMP/airplane-home" \
            TMPDIR="$RUNNER_TEMP/airplane-tmp" \
            PATH=/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin \
            S46_E2E_VERIFY_CANDIDATE_ONLY=0 \
            S46_E2E_QUALIFICATION=1 \
            S46_E2E_QUALIFICATION_SCOPE=airplane \
            S46_E2E_NETWORK_ISOLATION=external \
            S46_E2E_FILESYSTEM_ISOLATION=external \
            S46_E2E_EXPECTED_VERSION="$VERSION" \
            S46_E2E_EXPECTED_COMMIT="$PREPARED_COMMIT" \
            S46_E2E_CANDIDATE="$ARCHIVE" \
            S46_E2E_CANDIDATE_SHA256="$candidate_sha" \
            S46_E2E_QUALIFICATION_EVIDENCE="$EVIDENCE" \
            S46_E2E_MODEL_GGUF="$MODEL_GGUF" \
            S46_E2E_MODEL_SHA256="$MODEL_SHA256" \
            S46_E2E_LLAMA_ARCHIVE="$LLAMA_ARCHIVE" \
            S46_E2E_LLAMA_ARCHIVE_SHA256="$LLAMA_ARCHIVE_SHA256" \
            S46_E2E_LLAMA_SERVER_SHA256="$LLAMA_SERVER_SHA256" \
            S46_E2E_LLAMA_INVENTORY_SHA256="$LLAMA_INVENTORY_SHA256" \
            S46_E2E_GATEWAY_ARCHIVE="$GATEWAY_ARCHIVE" \
            S46_E2E_GATEWAY_ARCHIVE_SHA256="$GATEWAY_ARCHIVE_SHA256" \
            S46_E2E_GATEWAY_SHA256="$GATEWAY_SHA256" \
            S46_E2E_RUNNER_OS="$RUNNER_OS" \
            S46_E2E_RUNNER_ARCH="$RUNNER_ARCH" \
            S46_E2E_OS_VERSION="$OS_VERSION" \
            S46_E2E_RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            S46_E2E_RUNNER_NAME="$RUNNER_NAME" \
            S46_E2E_WORKFLOW_REF="$GITHUB_WORKFLOW_REF" \
            S46_E2E_WORKFLOW_SHA="$GITHUB_SHA" \
            S46_E2E_RUN_ID="$GITHUB_RUN_ID" \
            S46_E2E_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            S46_E2E_ENVIRONMENT=airplane-qualification \
            S46_E2E_ENVIRONMENT_APPROVER="$QUALIFICATION_APPROVER" \
            S46_E2E_ENVIRONMENT_REVIEWERS=goncalossilva \
            S46_E2E_ENVIRONMENT_PREVENT_SELF_REVIEW=true \
            S46_E2E_ENVIRONMENT_ADMINS_BYPASS=false \
            S46_E2E_SOURCE_TREE="$SOURCE_TREE" \
            S46_E2E_BUILD_RECEIPT_SHA256="$BUILD_RECEIPT_SHA256" \
            S46_E2E_BUILD_SIGNATURE_SHA256="$BUILD_SIGNATURE_SHA256" \
            S46_E2E_RELEASE_AUTHORITY_ORIGIN=https://models.s46.dev/release-authority/v1 \
            S46_E2E_RELEASE_AUTHORITY_ID="$RELEASE_AUTHORITY_ID" \
            S46_E2E_CANDIDATE_SEQUENCE=2 \
            S46_E2E_CANDIDATE_ETAG="$CANDIDATE_ETAG" \
            S46_E2E_CANDIDATE_RECORD_SHA256="$CANDIDATE_RECORD_SHA256" \
            S46_E2E_CANDIDATE_STALE_IF_MATCH_STATUS="$CANDIDATE_STALE_IF_MATCH_STATUS" \
            S46_E2E_ENVIRONMENT_APPROVAL_SHA256="$QUALIFICATION_APPROVAL_SHA256" \
            S46_E2E_RUNNER_IDENTITY_SHA256="$RUNNER_IDENTITY_SHA256" \
            S46_E2E_ISOLATION_PROFILE_SHA256="$ISOLATOR_SHA256" \
            /bin/bash "$GITHUB_WORKSPACE/scripts/e2e-airplane-harnesses"
          test -f "$EVIDENCE" && test ! -L "$EVIDENCE"
          go run ./scripts check-qualification "$RELEASE_TAG" "$PREPARED_COMMIT" "$ARCHIVE" "$EVIDENCE"
      - name: Upload immutable qualification evidence artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualification-darwin-arm64-airplane-${{ github.run_attempt }}
          path: ${{ steps.candidate.outputs.evidence }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false

  qualification-evidence-publisher:
    name: publish validated qualification evidence without candidate execution
    needs: [authority-candidate, native-cloud, darwin-arm64-airplane]
    if: always() && inputs.target != 'qualification-signatures' && needs.authority-candidate.result == 'success' && (needs.native-cloud.result == 'success' || needs.native-cloud.result == 'skipped') && (needs.darwin-arm64-airplane.result == 'success' || needs.darwin-arm64-airplane.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Verify exact workflow, artifact ledger, evidence, and append release assets once
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PREPARED_COMMIT: ${{ inputs.prepared_commit }}
          TARGET: ${{ inputs.target }}
          AUTHORITY_ID: ${{ needs.authority-candidate.outputs.release_id }}
          AUTHORITY_ETAG: ${{ needs.authority-candidate.outputs.candidate_etag }}
          AUTHORITY_RECORD_SHA256: ${{ needs.authority-candidate.outputs.candidate_record_sha256 }}
          SOURCE_TREE: ${{ needs.authority-candidate.outputs.source_tree }}
          BUILD_RECEIPT_SHA256: ${{ needs.authority-candidate.outputs.build_receipt_sha256 }}
          BUILD_SIGNATURE_SHA256: ${{ needs.authority-candidate.outputs.build_signature_sha256 }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$PREPARED_COMMIT"
          test "$GITHUB_WORKFLOW_REF" = "sovereign46/cli/.github/workflows/qualify-candidate.yml@refs/heads/main"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$PREPARED_COMMIT"
          case "$TARGET" in
            all) expected_artifacts='qualification-darwin-amd64 qualification-linux-amd64 qualification-linux-arm64 qualification-darwin-arm64-airplane' ;;
            darwin-amd64|linux-amd64|linux-arm64) expected_artifacts="qualification-$TARGET" ;;
            darwin-arm64-airplane) expected_artifacts='qualification-darwin-arm64-airplane' ;;
            *) echo "unsupported evidence publication target: $TARGET" >&2; exit 1 ;;
          esac
          version=${RELEASE_TAG#v}
          artifacts_json="$RUNNER_TEMP/artifacts.json"
          gh api --header "X-GitHub-Api-Version: 2022-11-28" "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > "$artifacts_json"
          ledger="$RUNNER_TEMP/artifact-ledger.tsv"
          python3 - "$artifacts_json" "$ledger" "$GITHUB_RUN_ID" "$PREPARED_COMMIT" "$GITHUB_RUN_ATTEMPT" $expected_artifacts <<'PY'
          import json, re, sys
          source, destination, run_id, commit, current_attempt, *expected = sys.argv[1:]
          with open(source, encoding="utf-8") as handle:
              document = json.load(handle)
          artifacts = document.get("artifacts", [])
          if (not isinstance(artifacts, list) or document.get("total_count") != len(artifacts) or
                  not 1 <= len(artifacts) <= 100 or len(expected) != len(set(expected))):
              raise SystemExit("qualification artifact ledger is incomplete or malformed")
          grouped = {name: [] for name in expected}
          for item in artifacts:
              name = item.get("name", "") if isinstance(item, dict) else ""
              match = re.fullmatch(r"(.+)-([1-9][0-9]*)", name)
              base = match.group(1) if match else ""
              attempt = int(match.group(2)) if match else 0
              workflow = item.get("workflow_run", {}) if isinstance(item, dict) else {}
              digest = item.get("digest", "") if isinstance(item, dict) else ""
              identifier = item.get("id") if isinstance(item, dict) else None
              if (base not in grouped or attempt > int(current_attempt) or item.get("expired") or
                      not isinstance(identifier, int) or isinstance(identifier, bool) or identifier <= 0 or
                      not re.fullmatch(r"sha256:[0-9a-f]{64}", digest) or
                      workflow.get("id") != int(run_id) or workflow.get("head_sha") != commit):
                  raise SystemExit(f"invalid attempt-qualified qualification artifact: {name!r}")
              grouped[base].append((attempt, item))
          with open(destination, "x", encoding="utf-8") as output:
              for base in sorted(expected):
                  if not grouped[base]:
                      raise SystemExit(f"missing qualification artifact for {base}")
                  producer_attempt = max(attempt for attempt, _ in grouped[base])
                  selected = [item for attempt, item in grouped[base] if attempt == producer_attempt]
                  if len(selected) != 1:
                      raise SystemExit(f"ambiguous qualification artifact for {base} attempt {producer_attempt}")
                  item = selected[0]
                  output.write(f"{base}\t{item['id']}\t{item['digest'][7:]}\t{producer_attempt}\n")
          PY
          evidence_dir="$RUNNER_TEMP/evidence"
          archive_dir="$RUNNER_TEMP/archives"
          evidence_attempts="$RUNNER_TEMP/evidence-attempts.tsv"
          mkdir -m 0700 "$evidence_dir" "$archive_dir"
          : > "$evidence_attempts"
          while IFS=$'\t' read -r artifact_name artifact_id artifact_digest producer_attempt; do
            case "$artifact_name" in
              qualification-darwin-amd64) evidence_name="s46_${version}_darwin_amd64.tar.gz.qualification.json" ;;
              qualification-linux-amd64) evidence_name="s46_${version}_linux_amd64.tar.gz.qualification.json" ;;
              qualification-linux-arm64) evidence_name="s46_${version}_linux_arm64.tar.gz.qualification.json" ;;
              qualification-darwin-arm64-airplane) evidence_name="s46_${version}_darwin_arm64.tar.gz.qualification.json" ;;
              *) echo "unexpected qualification artifact: $artifact_name" >&2; exit 1 ;;
            esac
            zip="$RUNNER_TEMP/$artifact_name-$producer_attempt.zip"
            curl --fail --location --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --output "$zip" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip"
            test "$(wc -c < "$zip" | tr -d '[:space:]')" -le 2097152
            test "$(sha256sum "$zip" | awk '{print $1}')" = "$artifact_digest"
            python3 - "$zip" "$evidence_name" "$evidence_dir" <<'PY'
          import os, pathlib, stat, sys, zipfile
          archive, expected_name, destination = sys.argv[1:]
          with zipfile.ZipFile(archive) as source:
              members = source.infolist()
              if len(members) != 1:
                  raise SystemExit("qualification artifact must contain exactly one file")
              member = members[0]
              name = pathlib.PurePosixPath(member.filename)
              if name.name != member.filename or member.filename != expected_name:
                  raise SystemExit("qualification artifact has an unexpected member name")
              mode = member.external_attr >> 16
              if stat.S_ISLNK(mode) or member.file_size <= 0 or member.file_size > 1048576 or member.flag_bits & 1:
                  raise SystemExit("qualification artifact member is linked, empty, oversized, or encrypted")
              content = source.read(member)
              if len(content) != member.file_size:
                  raise SystemExit("qualification artifact member is truncated")
          descriptor = os.open(pathlib.Path(destination) / member.filename, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
          with os.fdopen(descriptor, "wb") as output:
              output.write(content)
          PY
            printf '%s\t%s\n' "$evidence_name" "$producer_attempt" >> "$evidence_attempts"
          done < "$ledger"
          test "$(find "$evidence_dir" -maxdepth 1 -type f | wc -l | tr -d '[:space:]')" = "$(wc -l < "$evidence_attempts" | tr -d '[:space:]')"
          candidate_tag="candidate-$RELEASE_TAG-$PREPARED_COMMIT"
          release_json="$RUNNER_TEMP/candidate-release.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$candidate_tag" > "$release_json"
          test "$(jq -r .draft "$release_json")" = true
          test "$(jq -r .target_commitish "$release_json")" = "$PREPARED_COMMIT"
          version="${RELEASE_TAG#v}"
          python3 - "$release_json" "$version" <<'PY'
          import json, re, sys
          source, version = sys.argv[1:]
          with open(source, encoding="utf-8") as handle:
              release = json.load(handle)
          archives = {f"s46_{version}_{platform}.tar.gz" for platform in ("darwin_amd64", "darwin_arm64", "linux_amd64", "linux_arm64")}
          build = archives | {"checksums.txt", "release-build.json", "release-build.json.sig"}
          evidence = {name + ".qualification.json" for name in archives}
          signatures = {name + ".sig" for name in evidence}
          assets = release.get("assets", [])
          names = [asset.get("name") for asset in assets if isinstance(asset, dict)]
          ids = [asset.get("id") for asset in assets if isinstance(asset, dict)]
          if len(names) != len(assets) or len(names) != len(set(names)) or len(ids) != len(assets) or len(ids) != len(set(ids)):
              raise SystemExit("candidate asset ledger contains malformed or duplicate entries")
          present = set(names)
          if not build.issubset(present) or present - build - evidence - signatures:
              raise SystemExit("candidate changed outside the exact progressive qualification cohort")
          if present & signatures and present & evidence != evidence:
              raise SystemExit("candidate signatures exist before the native evidence cohort is complete")
          if any(asset.get("state") == "starter" for asset in assets) and present & signatures:
              raise SystemExit("candidate signatures coexist with incomplete native evidence")
          digest = re.compile(r"sha256:[0-9a-f]{64}")
          for asset in assets:
              name, identifier, size, asset_digest, state = asset.get("name"), asset.get("id"), asset.get("size"), asset.get("digest"), asset.get("state")
              maximum = 256 if name in signatures else 1048576 if name in evidence or name in {"checksums.txt", "release-build.json", "release-build.json.sig"} else 268435456
              if not isinstance(identifier, int) or isinstance(identifier, bool) or identifier <= 0:
                  raise SystemExit(f"candidate asset identity is invalid for {name!r}")
              if state == "starter":
                  if name not in evidence or size != 0 or asset_digest is not None:
                      raise SystemExit(f"candidate has an unrecoverable incomplete asset for {name!r}")
              elif state != "uploaded" or not isinstance(size, int) or isinstance(size, bool) or size <= 0 or size > maximum or not isinstance(asset_digest, str) or not digest.fullmatch(asset_digest):
                  raise SystemExit(f"candidate asset metadata is invalid for {name!r}")
          PY
          existing_evidence="$RUNNER_TEMP/existing-evidence"
          pending_evidence="$RUNNER_TEMP/pending-evidence"
          mkdir -m 0700 "$existing_evidence" "$pending_evidence"
          while IFS=$'\t' read -r evidence_name producer_attempt; do
            evidence="$evidence_dir/$evidence_name"
            archive_name="${evidence_name%.qualification.json}"
            scripts/release_authority.py download --kind candidate --id "$AUTHORITY_ID" --asset "$archive_name" --output "$archive_dir/$archive_name"
            python3 - "$evidence" "$archive_dir/$archive_name" "$archive_name" "$version" "$PREPARED_COMMIT" "$GITHUB_RUN_ID" "$producer_attempt" "$AUTHORITY_ID" "$AUTHORITY_ETAG" "$AUTHORITY_RECORD_SHA256" "$SOURCE_TREE" "$BUILD_RECEIPT_SHA256" "$BUILD_SIGNATURE_SHA256" <<'PY'
          import hashlib, json, os, sys
          evidence_path, archive_path, archive_name, version, commit, run_id, attempt, release_id, candidate_etag, record_sha, source_tree, receipt_sha, signature_sha = sys.argv[1:]
          with open(evidence_path, encoding="utf-8") as source:
              record = json.load(source)
          with open(archive_path, "rb") as source:
              content = source.read()
          digest = hashlib.sha256(content).hexdigest()
          artifact = record.get("artifact", {})
          build = record.get("build", {})
          qualification = record.get("qualification", {})
          execution = qualification.get("execution", {})
          if record.get("schema") != "s46.release-qualification.v1" or record.get("result") != "passed":
              raise SystemExit("qualification evidence is not a passed v1 record")
          if artifact != {"name": archive_name, "sha256": digest, "size": len(content), "kind": "archive"}:
              raise SystemExit("qualification evidence does not bind the exact archive")
          if (build.get("version") != version or build.get("commit") != commit or build.get("sourceTree") != source_tree or
                  build.get("buildReceiptSha256") != receipt_sha or build.get("buildSignatureSha256") != signature_sha or
                  qualification.get("expectedVersion") != version or qualification.get("expectedCommit") != commit):
              raise SystemExit("qualification evidence does not bind the exact source/build receipt identity")
          if execution.get("workflowSha") != commit or execution.get("workflowRef") != "sovereign46/cli/.github/workflows/qualify-candidate.yml@refs/heads/main" or execution.get("runId") != run_id or execution.get("runAttempt") != attempt:
              raise SystemExit("qualification evidence does not bind this exact workflow run")
          if execution.get("releaseAuthorityOrigin") != "https://models.s46.dev/release-authority/v1" or execution.get("releaseAuthorityId") != release_id or execution.get("candidateSequence") != 2 or execution.get("candidateEtag") != candidate_etag or execution.get("candidateRecordSha256") != record_sha or execution.get("candidateStaleIfMatchStatus") != 412:
              raise SystemExit("qualification evidence lacks the exact sequence-2 authority identity and stale-write proof")
          if execution.get("environmentApprover") != "goncalossilva" or execution.get("environmentReviewers") != ["goncalossilva"] or execution.get("environmentPreventSelfReview") is not True or execution.get("environmentAdminsBypass") is not False:
              raise SystemExit("qualification evidence lacks exact environment protection")
          airplane = archive_name.endswith("_darwin_arm64.tar.gz")
          expected_capabilities = ["cloud-client", "airplane"] if airplane else ["cloud-client"]
          expected_harnesses = ["pi", "claude-code", "codex"] if airplane else []
          if qualification.get("capabilities") != expected_capabilities or qualification.get("airplaneHarnesses") != expected_harnesses:
              raise SystemExit("qualification evidence has invalid capability scope")
          if airplane != (qualification.get("runtime") is not None):
              raise SystemExit("qualification evidence has invalid runtime scope")
          PY
            asset_state=$(jq -er --arg name "$evidence_name" '[.assets[] | select(.name == $name)] | if length == 0 then "missing" elif length == 1 then .[0].state else error("duplicate candidate asset") end' "$release_json")
            case "$asset_state" in
              uploaded)
                gh release download "$candidate_tag" --dir "$existing_evidence" --pattern "$evidence_name"
                cmp --silent "$evidence" "$existing_evidence/$evidence_name"
                ;;
              starter)
                starter_id=$(jq -er --arg name "$evidence_name" '[.assets[] | select(.name == $name and .state == "starter")][0].id' "$release_json")
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$starter_id"
                cp "$evidence" "$pending_evidence/$evidence_name"
                ;;
              missing)
                cp "$evidence" "$pending_evidence/$evidence_name"
                ;;
              *) echo "candidate evidence asset has an invalid state: $asset_state" >&2; exit 1 ;;
            esac
          done < "$evidence_attempts"
          if find "$pending_evidence" -maxdepth 1 -type f -print -quit | grep -q .; then
            while IFS= read -r pending; do
              gh release upload "$candidate_tag" "$pending"
            done < <(find "$pending_evidence" -maxdepth 1 -type f -print | sort)
          fi
          verified="$RUNNER_TEMP/verified-evidence"
          mkdir -m 0700 "$verified"
          for evidence in "$evidence_dir"/*; do
            name=$(basename "$evidence")
            gh release download "$candidate_tag" --dir "$verified" --pattern "$name"
            cmp --silent "$evidence" "$verified/$name"
          done
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$candidate_tag" > "$RUNNER_TEMP/candidate-after-evidence.json"
          python3 - "$RUNNER_TEMP/candidate-after-evidence.json" "$version" "$evidence_dir" <<'PY'
          import json, pathlib, re, sys
          source, version, evidence_dir = sys.argv[1:]
          with open(source, encoding="utf-8") as handle:
              release = json.load(handle)
          archives = {f"s46_{version}_{platform}.tar.gz" for platform in ("darwin_amd64", "darwin_arm64", "linux_amd64", "linux_arm64")}
          build = archives | {"checksums.txt", "release-build.json", "release-build.json.sig"}
          evidence = {name + ".qualification.json" for name in archives}
          signatures = {name + ".sig" for name in evidence}
          published = {path.name for path in pathlib.Path(evidence_dir).iterdir() if path.is_file() and not path.is_symlink()}
          assets = release.get("assets", [])
          names = [asset.get("name") for asset in assets if isinstance(asset, dict)]
          ids = [asset.get("id") for asset in assets if isinstance(asset, dict)]
          if len(names) != len(assets) or len(names) != len(set(names)) or len(ids) != len(assets) or len(ids) != len(set(ids)):
              raise SystemExit("candidate cohort has malformed or duplicate assets after evidence publication")
          present = set(names)
          if not build.issubset(present) or not published.issubset(present) or present - build - evidence - signatures:
              raise SystemExit("candidate cohort is not a valid progressive set after evidence publication")
          if present & signatures and present & evidence != evidence:
              raise SystemExit("candidate signatures exist before the native evidence cohort is complete")
          digest = re.compile(r"sha256:[0-9a-f]{64}")
          for asset in assets:
              name, identifier, size, asset_digest = asset.get("name"), asset.get("id"), asset.get("size"), asset.get("digest")
              maximum = 256 if name in signatures else 1048576 if name in evidence or name in {"checksums.txt", "release-build.json", "release-build.json.sig"} else 268435456
              if asset.get("state") != "uploaded" or not isinstance(identifier, int) or isinstance(identifier, bool) or identifier <= 0 or not isinstance(size, int) or isinstance(size, bool) or size <= 0 or size > maximum or not isinstance(asset_digest, str) or not digest.fullmatch(asset_digest):
                  raise SystemExit(f"candidate metadata is invalid after evidence publication for {name!r}")
          PY

  qualification-signature-publisher:
    name: publish validated signatures without build-context execution
    needs: qualification-signature-validation
    if: inputs.target == 'qualification-signatures' && needs.qualification-signature-validation.result == 'success'
    runs-on: ubuntu-24.04
    environment: qualification-signature-upload
    permissions:
      actions: read
      contents: write
      deployments: read
    steps:
      - name: Verify protected environment and immutable signature artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PREPARED_COMMIT: ${{ inputs.prepared_commit }}
          ARTIFACT_ID: ${{ needs.qualification-signature-validation.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.qualification-signature-validation.outputs.artifact_digest }}
          ARTIFACT_NAME: ${{ needs.qualification-signature-validation.outputs.artifact_name }}
          PRODUCER_ATTEMPT: ${{ needs.qualification-signature-validation.outputs.producer_attempt }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$PREPARED_COMMIT"
          test "$GITHUB_WORKFLOW_REF" = "sovereign46/cli/.github/workflows/qualify-candidate.yml@refs/heads/main"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$PREPARED_COMMIT"
          policy="$RUNNER_TEMP/signature-environment.json"
          approvals="$RUNNER_TEMP/signature-approvals.json"
          gh api "repos/$GITHUB_REPOSITORY/environments/qualification-signature-upload" > "$policy"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" > "$approvals"
          jq -e '.can_admins_bypass == false and (.protection_rules | length) == 1 and .protection_rules[0].type == "required_reviewers" and .protection_rules[0].prevent_self_review == true and ([.protection_rules[0].reviewers[] | select(.type == "User") | .reviewer.login] | sort) == ["goncalossilva"]' "$policy" >/dev/null
          jq -e 'any(.[]; (.state | ascii_downcase) == "approved" and .user.login == "goncalossilva" and any(.environments[]?; .name == "qualification-signature-upload"))' "$approvals" >/dev/null
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PRODUCER_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          test "$ARTIFACT_NAME" = "validated-qualification-signatures-$PRODUCER_ATTEMPT"
          artifacts="$RUNNER_TEMP/artifacts.json"
          gh api --header "X-GitHub-Api-Version: 2022-11-28" "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > "$artifacts"
          jq -e --argjson id "$ARTIFACT_ID" --arg name "$ARTIFACT_NAME" --arg digest "sha256:$ARTIFACT_DIGEST" \
            --argjson run "$GITHUB_RUN_ID" --arg commit "$PREPARED_COMMIT" '
            [.artifacts[] | select(.id == $id)] as $selected |
            .total_count == (.artifacts | length) and .total_count <= 100 and ($selected | length) == 1 and
            ($selected[0].expired | not) and $selected[0].name == $name and $selected[0].digest == $digest and
            $selected[0].workflow_run.id == $run and $selected[0].workflow_run.head_sha == $commit
          ' "$artifacts" >/dev/null
          zip="$RUNNER_TEMP/validated-signatures.zip"
          curl --fail --location --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$zip" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"
          test "$(wc -c < "$zip" | tr -d '[:space:]')" -le 1048576
          test "$(sha256sum "$zip" | awk '{print $1}')" = "$ARTIFACT_DIGEST"
          signatures="$RUNNER_TEMP/signatures"
          mkdir -m 0700 "$signatures"
          version="${RELEASE_TAG#v}"
          python3 - "$zip" "$signatures" "$version" <<'PY'
          import base64, binascii, os, pathlib, re, stat, sys, zipfile
          archive, destination, version = sys.argv[1:]
          expected_signatures = {f"s46_{version}_{platform}.tar.gz.qualification.json.sig" for platform in ("darwin_amd64", "darwin_arm64", "linux_amd64", "linux_arm64")}
          expected = expected_signatures | {"candidate-ledger.json"}
          with zipfile.ZipFile(archive) as source:
              members = source.infolist()
              if {member.filename for member in members} != expected:
                  raise SystemExit("signature artifact does not contain the exact signatures and candidate ledger")
              for member in members:
                  mode = member.external_attr >> 16
                  if stat.S_ISLNK(mode) or member.file_size <= 0 or member.file_size > 1048576 or member.flag_bits & 1:
                      raise SystemExit("signature artifact has unsafe metadata")
                  raw = source.read(member)
                  if member.filename in expected_signatures:
                      if member.file_size > 256:
                          raise SystemExit("signature artifact member is oversized")
                      value = raw.decode("ascii").strip()
                      try:
                          decoded = base64.b64decode(value, validate=True)
                      except (ValueError, binascii.Error) as error:
                          raise SystemExit(f"invalid signature encoding: {error}")
                      if len(decoded) != 64 or base64.b64encode(decoded).decode() != value or raw != (value + "\n").encode():
                          raise SystemExit("signature artifact is not canonical")
                  descriptor = os.open(pathlib.Path(destination) / member.filename, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
                  with os.fdopen(descriptor, "wb") as output:
                      output.write(raw)
          PY
          candidate_tag="candidate-$RELEASE_TAG-$PREPARED_COMMIT"
          candidate_current="$RUNNER_TEMP/signature-candidate-current.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$candidate_tag" > "$candidate_current"
          python3 - "$candidate_current" "$candidate_tag" "$PREPARED_COMMIT" "$version" "$signatures/candidate-ledger.json" <<'PY'
          import json, re, sys
          source, tag, commit, version, baseline_path = sys.argv[1:]
          with open(source, encoding="utf-8") as handle:
              release = json.load(handle)
          with open(baseline_path, encoding="utf-8") as handle:
              baseline = json.load(handle)
          archives = {f"s46_{version}_{platform}.tar.gz" for platform in ("darwin_amd64", "darwin_arm64", "linux_amd64", "linux_arm64")}
          build = archives | {"checksums.txt", "release-build.json", "release-build.json.sig"}
          evidence = {name + ".qualification.json" for name in archives}
          signatures = {name + ".sig" for name in evidence}
          assets = release.get("assets", [])
          names = [asset.get("name") for asset in assets if isinstance(asset, dict)]
          ids = [asset.get("id") for asset in assets if isinstance(asset, dict)]
          if release.get("draft") is not True or release.get("tag_name") != tag or release.get("target_commitish") != commit:
              raise SystemExit("signature publisher candidate identity is invalid")
          if len(names) != len(assets) or len(names) != len(set(names)) or len(ids) != len(assets) or len(ids) != len(set(ids)):
              raise SystemExit("signature publisher candidate has malformed or duplicate assets")
          present = set(names)
          if not build.issubset(present) or not evidence.issubset(present) or present - build - evidence - signatures:
              raise SystemExit("signature publisher requires the exact build and complete native evidence cohort")
          digest = re.compile(r"sha256:[0-9a-f]{64}")
          for asset in assets:
              name, identifier, size, asset_digest, state = asset.get("name"), asset.get("id"), asset.get("size"), asset.get("digest"), asset.get("state")
              maximum = 256 if name in signatures else 1048576 if name in evidence or name in {"checksums.txt", "release-build.json", "release-build.json.sig"} else 268435456
              if not isinstance(identifier, int) or isinstance(identifier, bool) or identifier <= 0:
                  raise SystemExit(f"signature publisher candidate identity is invalid for {name!r}")
              if state == "starter":
                  if name not in signatures or size != 0 or asset_digest is not None:
                      raise SystemExit(f"signature publisher found an unrecoverable incomplete asset for {name!r}")
              elif state != "uploaded" or not isinstance(size, int) or isinstance(size, bool) or size <= 0 or size > maximum or not isinstance(asset_digest, str) or not digest.fullmatch(asset_digest):
                  raise SystemExit(f"signature publisher candidate metadata is invalid for {name!r}")
          if any(baseline.get(field) != release.get(field) for field in ("id", "tag_name", "target_commitish", "draft")):
              raise SystemExit("signature candidate identity changed after validation")
          normalized = lambda item: {field: item.get(field) for field in ("id", "name", "size", "digest", "updated_at")}
          baseline_assets = {item.get("name"): item for item in baseline.get("assets", []) if isinstance(item, dict)}
          current_assets = {item.get("name"): normalized(item) for item in assets}
          def preserves_baseline(name, item):
              if current_assets.get(name) == item:
                  return True
              return name in signatures and item.get("size") == 0 and item.get("digest") is None
          if (len(baseline_assets) != len(baseline.get("assets", [])) or
                  any(not preserves_baseline(name, item) for name, item in baseline_assets.items()) or
                  set(current_assets) - set(baseline_assets) - signatures):
              raise SystemExit("signature candidate changed outside an exact recoverable signature append")
          PY
          existing_signatures="$RUNNER_TEMP/existing-signatures"
          pending_signatures="$RUNNER_TEMP/pending-signatures"
          mkdir -m 0700 "$existing_signatures" "$pending_signatures"
          for signature in "$signatures"/*.qualification.json.sig; do
            name=$(basename "$signature")
            asset_state=$(jq -er --arg name "$name" '[.assets[] | select(.name == $name)] | if length == 0 then "missing" elif length == 1 then .[0].state else error("duplicate candidate asset") end' "$candidate_current")
            case "$asset_state" in
              uploaded)
                gh release download "$candidate_tag" --dir "$existing_signatures" --pattern "$name"
                cmp --silent "$signature" "$existing_signatures/$name"
                ;;
              starter)
                starter_id=$(jq -er --arg name "$name" '[.assets[] | select(.name == $name and .state == "starter")][0].id' "$candidate_current")
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$starter_id"
                cp "$signature" "$pending_signatures/$name"
                ;;
              missing)
                cp "$signature" "$pending_signatures/$name"
                ;;
