version: 2

project_name: s46

before:
  hooks:
    - env GOWORK=off go mod verify

builds:
  - id: s46
    main: ./cmd/s46
    binary: s46
    env:
      - CGO_ENABLED=0
      - GOWORK=off
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -tags=release
    ldflags:
      - -s -w -X github.com/sovereign46/cli/internal/version.Version={{.Version}} -X github.com/sovereign46/cli/internal/version.Commit={{.Commit}} -X github.com/sovereign46/cli/internal/version.Date={{.Date}}

archives:
  - id: s46
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

checksum:
  name_template: checksums.txt

# Release publication is deliberately handled only after qualification by the
# tag workflow. GoReleaser builds the candidate bundle but cannot publish or
# replace its bytes.
release:
  disable: true
  replace_existing_artifacts: false

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
